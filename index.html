function readMapping() {
  const v = id => $(id).value;
  return {
    name: v('#mName').trim(), counter: v('#mCounter'), headerRows: Number(v('#mHeader')) || 0,
    dateCol: Number(v('#mDate')), descCol: Number(v('#mDesc')), memoCol: v('#mMemo') === '' ? '' : Number(v('#mMemo')),
    amountMode: v('#mMode'), amountCol: Number(v('#mAmount')), sign: v('#mSign'),
    outCol: Number(v('#mOut')), inCol: Number(v('#mIn')), encoding: S.imp.preview.encoding
  };
}

function renderCsvPreview() {
  const m = readMapping();
  const rows = S.imp.preview.rows;
  const cols = Math.max(...rows.map(r => r.length), 1);
  const role = {};
  role[m.dateCol] = '日付'; role[m.descCol] = '摘要';
  if (m.memoCol !== '') role[m.memoCol] = '補足';
  if (m.amountMode === 'single') role[m.amountCol] = '金額'; else { role[m.outCol] = '出金'; role[m.inCol] = '入金'; }
  $('#csvPrev').innerHTML = `<table class="csv"><thead><tr><th></th>${Array.from({ length: cols }, (_, i) =>
    `<th class="${role[i] ? 'mapped' : ''}">${colName(i)}${role[i] ? '・' + role[i] : ''}</th>`).join('')}</tr></thead><tbody>${rows.map((r, ri) =>
    `<tr><td class="small muted">${ri + 1}</td>${Array.from({ length: cols }, (_, i) => `<td class="${ri < m.headerRows ? 'hd' : ''}" title="${esc(r[i])}">${esc(r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

async function doImport() {
  const preset = readMapping();

    S.boot.presets = S.boot.presets.filter(p => p.name !== preset.name).concat([preset]);

  $('#dRule').onchange = ev => { e.rule = ev.target.checked; };
  $('#dPat').oninput = ev => { e.pattern = ev.target.value; if (ev.target.value) { e.rule = true; $('#dRule').checked = true; } };
  $('#dPrev').onclick = () => { S.ib.sel = list[pos - 1].id; redraw(); };
  $('#dNext').onclick = () => { S.ib.sel = list[pos + 1].id; redraw(); };
  $('#dPriv').onclick = () => { e.account = i.direction === 'out' ? '190' : '290'; postOne(i, list); };
  $('#dSkip').onclick = async () => { await run('skipInbox', { ids: [i.id] }); removeFromInbox(i, list); toast('スキップしました'); };
  $('#dPost').onclick = () => postOne(i, list);
}

async function postOne(i, list) {
  const e = editOf(i);
  if (!e.account) return toast('科目を選んでください', true);
  const r = await run('postInbox', { items: [{ id: i.id, account: e.account, ratio: e.ratio, saveRule: e.rule && !!e.pattern, pattern: e.pattern }] });
  if (r.errors.length) return toast(r.errors[0].message, true);
  removeFromInbox(i, list);
  toast(`記帳しました：${accName(e.account)} ${yen(i.amount)}円` + (r.rulesAdded ? '（ルールを追加）' : ''));
  if (r.rulesAdded) { // 同じルールに当たる他の明細にも科目を入れる
    const pat = e.pattern.normalize('NFKC').toLowerCase();
    S.inbox.forEach(x => { if (!x.suggested && x.direction === i.direction && x.desc.normalize('NFKC').toLowerCase().includes(pat)) { x.suggested = e.account; editOf(x).account = e.account; } });
    drawInbox();
  }
}

function removeFromInbox(i, list) {
  const pos = list.findIndex(x => x.id === i.id);
  const next = list[pos + 1] || list[pos - 1];
  S.inbox = S.inbox.filter(x => x.id !== i.id);
  delete S.ib.edit[i.id];
  setBadge(S.inbox.length);
  if (!S.inbox.length) return go('inbox');
  S.ib.sel = next ? next.id : null;
  drawInbox();
}

document.addEventListener('keydown', ev => {
  if (S.view !== 'inbox' || !$('#ibDetail')) return;
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (ev.key === 'Enter') { const b = $('#dPost'); if (b && !b.disabled) { ev.preventDefault(); b.click(); } }
  else if (ev.key === 'ArrowDown' || ev.key === 'j') { const b = $('#dNext'); if (b && !b.disabled) { ev.preventDefault(); b.click(); } }
  else if (ev.key === 'ArrowUp' || ev.key === 'k') { const b = $('#dPrev'); if (b && !b.disabled) { ev.preventDefault(); b.click(); } }
  else if (/^[1-9]$/.test(ev.key)) { const c = $$('#ibDetail .achip')[Number(ev.key) - 1]; if (c) c.click(); }
});

function defaultPattern(desc) {
  return String(desc).normalize('NFKC').split(/[\s\/／]+/)[0].slice(0, 20);
}

function siteMonthChart(st, colorOf) {
  const W = 640, H = 220, P = { l: 44, r: 6, t: 8, b: 22 };
  const tot = st.months.map(m => m.price), max = Math.max(1, ...tot), step = niceStep(max), top = Math.ceil(max / step) * step;
  const cw = (W - P.l - P.r) / 12, bw = Math.min(26, cw * 0.6);
  const y = v => P.t + (H - P.t - P.b) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v >= 10000 ? (v / 10000) + '万' : v}</text>`;
  st.months.forEach((m, i) => {
    const x = P.l + cw * i + (cw - bw) / 2; let acc = 0;
    st.allSites.forEach(site => {
      const v = m.bySite[site] || 0; if (!v) return;
      g += `<rect x="${x}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}" fill="${colorOf(site)}"><title>${i + 1}月 ${site} ${yen(v)}円</title></rect>`;
      acc += v;
    });
    g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${i + 1}月</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="月別の売上">${g}</svg>`;
}

function entryLines() {
  const d = $('#eDebit').value, c = $('#eCredit').value, amt = toInt($('#eAmount').value);
  const ratio = Number($('#eRatio').value) || 100;
  const dt = (acc(d) || {}).type;
  const canSplit = ['費用', '原価', '資産'].includes(dt) && d !== '190';
  $('#eRatioWrap').style.opacity = canSplit ? 1 : .4;
  if (!(amt > 0)) return null;
  const lines = [];
  if (canSplit && ratio < 100) {
    const biz = Math.round(amt * ratio / 100);
    lines.push({ a: d, dr: biz });
    if (amt - biz > 0) lines.push({ a: '190', dr: amt - biz });
  } else lines.push({ a: d, dr: amt });
  lines.push({ a: c, cr: amt });
  return lines;
}

function previewEntry() {
  if ($('#eDebitHint')) $('#eDebitHint').textContent = hintOf($('#eDebit').value);
  if ($('#eCreditHint')) $('#eCreditHint').textContent = hintOf($('#eCredit').value);
  const lines = entryLines();
  if (!lines) { $('#ePrev').innerHTML = '<span class="muted small">金額を入れると表示されます</span>'; return; }
  const dr = lines.filter(l => l.dr), cr = lines.filter(l => l.cr);
  const n = Math.max(dr.length, cr.length);
  let h = '<table><thead><tr><th>借方</th><th class="num">金額</th><th>貸方</th><th class="num">金額</th></tr></thead><tbody>';
  for (let i = 0; i < n; i++) {
    h += `<tr><td>${dr[i] ? esc(accName(dr[i].a)) : ''}</td><td class="num">${dr[i] ? yen(dr[i].dr) : ''}</td><td>${cr[i] ? esc(accName(cr[i].a)) : ''}</td><td class="num">${cr[i] ? yen(cr[i].cr) : ''}</td></tr>`;
  }
  $('#ePrev').innerHTML = h + '</tbody></table>';
}

async function saveEntry() {
  const amount = toInt($('#eAmount').value);
  if (!(amount > 0)) return toast('金額を入力してください', true);
  const payload = {
    date: $('#eDate').value, debit: $('#eDebit').value, credit: $('#eCredit').value, amount,
    ratio: Number($('#eRatio').value) || 100, memo: $('#eMemo').value.trim(), partner: $('#ePartner').value.trim()
  };
  const f = $('#eFile').files[0];
  if (f) {
    if (f.size > 20 * 1024 * 1024) return toast('証憑ファイルは20MBまでです', true);
    payload.voucher = { name: f.name, mime: f.type, base64: await fileToBase64(f) };
  }
  const r = await run('addEntry', payload);
  S.lastDate = payload.date;
  toast(`記帳しました（${r.entry_id}）` + (r.voucher_url ? '・証憑をダウンロードしました' : ''));
  ['#eAmount', '#eMemo', '#ePartner'].forEach(id => $(id).value = '');
  $('#eFile').value = ''; $('#eRatio').value = 100; previewEntry(); $('#eAmount').focus();
}

    $$('#cRows tr').forEach(tr => {
      const i = Number(tr.dataset.i);

    draw();
  };

    const lines = S.cLines.filter(l => l.a && (toInt(l.d) || toInt(l.c))).map(l => ({ account: l.a, debit: toInt(l.d) || 0, credit: toInt(l.c) || 0 }));

    S.lastDate = payload.date; S.cLines = null;
    toast(`記帳しました（${r.entry_id}）`); go('entry');
  };
  draw();
  return Promise.resolve();
}

/* ================= 表（CSV）の読み込み：棚卸・仕入で共通 ================= */
const TBL_COLS = {
  date: ['日付', '購入日時', '購入日', '仕入日', '取引日'],
  item: ['石の種類', '石', '品目', '種類', '品名'],
  title: ['商品名', 'タイトル', '商品'],
  spec: ['形・サイズ', '形', 'サイズ', 'サイズ・規格', '規格'],
  qty: ['数量', '個数', '在庫数', '在庫', '数', '数量（個）', '数量（粒）'],
  unit: ['単位'],
  unit_cost: ['単価', '仕入単価', '1個あたり', '1粒あたり'],
  amount: ['金額', '商品代金', '仕入金額', '合計', '金額（円）'],
  note: ['メモ', '備考', '単価の根拠・メモ', '単価の根拠'],
  category: ['区分'],
  partner: ['仕入先', '購入先'],
  item_id: ['商品ID']
};
function parseTableText(text) {
  text = String(text || '').replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  const first = text.split('\n', 1)[0];
  const sep = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const clean = rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x));
  if (!clean.length) return [];
  const head = clean[0].map(h => h.normalize('NFKC').replace(/\s/g, ''));
  const idx = {};
  Object.keys(TBL_COLS).forEach(k => {
    for (const name of TBL_COLS[k]) { const j = head.indexOf(name.normalize('NFKC')); if (j >= 0 && !Object.values(idx).includes(j)) { idx[k] = j; break; } }
  });
  if (!('item' in idx) && !('title' in idx)) throw new Error('1行目に「石の種類」または「商品名」の見出しが見つかりません。ひな形のCSVを使うか、見出しを付けてください。');
  return clean.slice(1).map(r => { const o = {}; Object.keys(idx).forEach(k => o[k] = r[idx[k]] || ''); return o; });
}
async function readTableFile(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { return new TextDecoder('shift_jis').decode(buf); }
}
/** 石の種類が空の行は商品名から推定して埋める */
async function fillStones(rows) {
  if (!rows.length) return;
  const g = await run('guessStones', { titles: rows.map(r => r.item || r.title || '') }, { quiet: true });
  rows.forEach((r, i) => {
    if (r.item) { if (g[i].stone) r.item = g[i].stone; return; }   // ヒスイ→翡翠 のように辞書の正式名にそろえる
    if (!r.title) return;
    r.item = g[i].stone; if (!r.spec) r.spec = g[i].shape; r.guessed = !!g[i].stone;
  });
}
function tableImporterHtml(id, title, hint) {
  return `<details class="help" id="${id}"><summary>${title}</summary>
    <p class="small" style="margin:6px 0 10px">${hint}</p>
    <div class="form">
      <label class="f wide">CSVファイル<input type="file" id="${id}File" accept=".csv,.tsv,.txt,text/csv,text/plain"></label></div>
    <label class="f" style="margin-top:10px">または、Excelやスプレッドシートの表をコピーして貼り付け
      <textarea id="${id}Paste" rows="3" placeholder="見出しの行ごと貼り付けてください" style="resize:vertical"></textarea></label>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="${id}Go">貼り付けた表を読み込む</button>
      <a href="#" class="small" id="${id}Tpl">ひな形CSVをダウンロード</a></div></details>`;
}
function bindTableImporter(id, template, fileName, onRows) {
  const handle = async text => {
    try { const rows = parseTableText(text); if (!rows.length) throw new Error('読み込める行がありませんでした'); await onRows(rows); }
    catch (e) { toast(e.message || String(e), true); }
  };
  $('#' + id + 'File').onchange = async e => { const f = e.target.files[0]; if (f) await handle(await readTableFile(f)); e.target.value = ''; };
  $('#' + id + 'Go').onclick = () => handle($('#' + id + 'Paste').value);
  $('#' + id + 'Tpl').onclick = e => {
    e.preventDefault();
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent('﻿' + template);
    a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
  };
}

const aiReady = () => !!(S.boot.aiKeys && S.boot.aiKeys[S.boot.aiProvider || 'gemini']);
/** 単価が空欄の行（all=false のときは確認のうえ全行）にAIの仕入相場を入れる */
async function aiStockPrices(onlyEmpty) {
  if (!aiReady()) return toast('設定画面で AI（Gemini など）の APIキーを登録すると使えます', true);
  let targets = S.invRows.map((r, i) => ({ r, i })).filter(x => x.r.item && (qtyOf(x.r.qty) || 0) >= 0);
  const empty = targets.filter(x => !String(x.r.unit_cost || '').trim());
  if (onlyEmpty || empty.length) targets = empty;
  if (!targets.length) return toast('単価が空欄の行はありません（入れ直す場合は、単価を消してから押してください）');
  let done = 0, miss = 0;
  for (let k = 0; k < targets.length; k += 30) {
    const chunk = targets.slice(k, k + 30);
    toast(`AIが相場を調べています…（${Math.min(k + 30, targets.length)} / ${targets.length}行）`);
    let res;
    try { res = await run('aiStockPrices', { items: chunk.map(x => ({ i: x.i, stone: x.r.item, spec: x.r.spec, unit: x.r.unit })) }, { quiet: true }); }
    catch (e) { toast(String(e.message || e), true); break; }
    const by = Object.fromEntries(res.map(a => [a.i, a]));
    chunk.forEach(x => {
      const a = by[x.i];
      if (!a || !(a.unit_cost > 0)) { miss++; return; }
      x.r.unit_cost = String(a.unit_cost);
      const ai = `AI相場${a.low && a.high ? ` ${yen(a.low)}〜${yen(a.high)}円` : ''}${a.reason ? '・' + a.reason : ''}`;
      const keep = String(x.r.note || '').split('／').filter(t => t && !/^AI相場/.test(t));
      x.r.note = keep.concat(ai).join('／').slice(0, 120);
      done++;
    });
    drawInvRows();
  }
  toast(`${done}行にAIの仕入相場を入れました` + (miss ? `（${miss}行は見積もれなかったので手入力してください）` : '') + '。内容を確かめて「保存」を押してください');
}

const keyOf = (stone, size) => String(stone || '').normalize('NFKC').toLowerCase().replace(/\s/g, '') + '|' + String(size || '').normalize('NFKC').toLowerCase().replace(/\s/g, '');

function drawInvRows() {
  const units = ['個', '粒', '連', '本', 'g', 'm', '袋', '点'];
  const stones = [...new Set((S.uc || []).map(u => u.stone))], sizes = [...new Set((S.uc || []).map(u => u.size).concat(['勾玉', 'ポイント', 'ダブルポイント', '丸玉', 'さざれ', '原石', 'タンブル', '彫刻', 'ビーズ']))];
  $('#iRows').innerHTML = S.invRows.map((r, i) => `<tr data-i="${i}">
    <td><select data-k="category">${INV_CATS.map(c => `<option ${r.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></td>
    <td><input data-k="item" value="${esc(r.item)}" list="stones" placeholder="例：ローズクォーツ"></td>
    <td><input data-k="spec" value="${esc(r.spec)}" list="sizes" placeholder="例：勾玉" style="width:100px"></td>
    <td><input data-k="unit" value="${esc(r.unit || '個')}" list="units" style="width:60px"></td>
    <td><input data-k="qty" value="${esc(r.qty)}" inputmode="decimal" placeholder="3×48" style="width:84px;text-align:right"></td>
    <td><input data-k="unit_cost" value="${esc(r.unit_cost)}" inputmode="decimal" style="width:84px;text-align:right"></td>
    <td class="num amt"></td>
    <td><input data-k="note" value="${esc(r.note)}" placeholder="単価の根拠"></td>
    <td><button class="btn sm ghost" data-del="${i}">削除</button></td></tr>`).join('') +
    `<datalist id="units">${units.map(u => `<option value="${u}">`).join('')}</datalist>` +
    `<datalist id="stones">${stones.map(u => `<option value="${esc(u)}">`).join('')}</datalist>` +
    `<datalist id="sizes">${sizes.map(u => `<option value="${esc(u)}">`).join('')}</datalist>`;
  $$('#iRows tr').forEach(tr => {
    const i = Number(tr.dataset.i);
    $$('[data-k]', tr).forEach(inp => inp.oninput = inp.onchange = () => { S.invRows[i][inp.dataset.k] = inp.value; invTotals(); });
    $('[data-k=qty]', tr).onblur = e => { const q = qtyOf(e.target.value); if (q && String(q) !== e.target.value) { e.target.value = q; S.invRows[i].qty = q; invTotals(); } };
  });
  $$('[data-del]').forEach(b => b.onclick = () => { S.invRows.splice(Number(b.dataset.del), 1); if (!S.invRows.length) S.invRows.push({ category: '仕入品', unit: '個' }); drawInvRows(); });
  invTotals();
}

function invTotals() {
  const by = {}; let total = 0;
  $$('#iRows tr').forEach(tr => {
    const r = S.invRows[Number(tr.dataset.i)];
    const amt = Math.round((qtyOf(r.qty) || 0) * (parseFloat(String(r.unit_cost || '').replace(/,/g, '')) || 0));
    $('.amt', tr).textContent = amt ? yen(amt) : '';
    by[r.category] = (by[r.category] || 0) + amt; total += amt;
  });
  $('#iTotals').innerHTML = Object.keys(by).filter(k => by[k]).map(k => `${esc(k)} ${yen(by[k])}`).join('　') + `　<b>合計 ${yen(total)} 円</b>`;
}

/** ブラウザのダイアログを使わず、ボタンを2回押して確定 */
function confirmInline(btn) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; const t = btn.textContent; btn.textContent = 'もう一度押すと取消'; btn.classList.add('red');
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = t; btn.classList.remove('red'); }, 3000);
  return false;
}

function journalRow(e) {
  const dr = e.lines.filter(l => l.debit), cr = e.lines.filter(l => l.credit);
  const src = e.source === 'manual' ? '手入力' : e.source === 'opening' ? '期首' : e.source === 'reversal' ? '取消' : String(e.source).replace(/^csv:/, '');
  const dim = e.reversed_by || e.reversal_of;
  return `<tr class="${dim ? 'dim' : ''}">
    <td class="small" style="white-space:nowrap">${e.date}<div class="muted">${e.entry_id}</div></td>
    <td class="lines">${dr.map(l => `<div><span>${esc(accName(l.account))}</span><span class="num">${yen(l.debit)}</span></div>`).join('')}</td>
    <td class="lines">${cr.map(l => `<div><span>${esc(accName(l.account))}</span><span class="num">${yen(l.credit)}</span></div>`).join('')}</td>
    <td><div class="ellipsis">${esc(e.memo)}</div>${e.partner ? `<div class="small muted">${esc(e.partner)}</div>` : ''}</td>
    <td><span class="tag">${esc(src)}</span>${e.voucher_url ? ` <a class="small" href="${esc(e.voucher_url)}" target="_blank" rel="noopener">証憑</a>` : ''}</td>
    <td style="text-align:right">${e.reversed_by ? `<span class="tag warn">取消済</span>` : e.reversal_of ? `<span class="small muted">${e.reversal_of}の取消</span>` : e.source === 'opening' ? '' : `<button class="btn sm" data-rev="${e.entry_id}">取消</button>`}</td>

}

function ruleRow(r) {
  return `<tr data-id="${esc(r.id)}">
    <td><input class="rp" value="${esc(r.pattern)}" placeholder="${r.id ? '' : '新しいルール（例：ADOBE）'}"></td>
    <td><select class="rd" style="min-width:90px">${[['out', '支出'], ['in', '入金'], ['any', 'どちらも']].map(([v, l]) => `<option value="${v}" ${r.direction === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
    <td><select class="ra">${accOptions(r.account, null, '科目を選択')}</select></td>
    <td><input type="number" class="rr" min="1" max="100" value="${r.ratio}" style="width:72px"> %</td>
    <td><input type="checkbox" class="re" ${r.enabled ? 'checked' : ''}></td>
    <td style="white-space:nowrap"><button class="btn sm rs">${r.id ? '保存' : '追加'}</button>${r.id ? ' <button class="btn sm ghost rx">削除</button>' : ''}</td></tr>`;
}

function bindRules() {
  $$('#ruleRows tr').forEach(tr => {
    $('.rs', tr).onclick = async () => {
      const rule = { id: tr.dataset.id, pattern: $('.rp', tr).value.trim(), direction: $('.rd', tr).value, account: $('.ra', tr).value, ratio: Number($('.rr', tr).value) || 100, enabled: $('.re', tr).checked };
      const rules = await run('saveRule', { rule });
      $('#ruleRows').innerHTML = rules.map(ruleRow).join('') + ruleRow({ id: '', pattern: '', direction: 'out', account: '', ratio: 100, enabled: true });
      bindRules(); toast('ルールを保存しました');
    };
    const x = $('.rx', tr);
    if (x) x.onclick = async () => {
      if (!confirmInline(x)) return;
      const rules = await run('deleteRule', { id: tr.dataset.id });
      $('#ruleRows').innerHTML = rules.map(ruleRow).join('') + ruleRow({ id: '', pattern: '', direction: 'out', account: '', ratio: 100, enabled: true });
      bindRules(); toast('削除しました');
    };
  });
}

function applyFont(f) {
  document.documentElement.classList.remove('fs-l', 'fs-xl');
  if (f === 'l' || f === 'xl') document.documentElement.classList.add('fs-' + f);
  const l = $('#fsLbl'); if (l) l.textContent = { m: '標準', l: '大', xl: '特大' }[f] || '大';
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const n = e.target.closest('#nav a, #subnav a, .tools a[data-view], #tabbar a, #moreSheet a');
  if (n) { e.preventDefault(); go(n.dataset.view); }
});

(async function init() {
  const slow = setTimeout(() => {
    if (S.boot) return;
    $('#main').innerHTML = `<div class="card"><h2>起動に時間がかかっています</h2><p>はじめて開いたときや、コードを更新した直後は、シートの準備で30秒ほどかかることがあります。このままお待ちください。</p>
      <p class="small muted">1分以上この表示のままの場合：Apps Script の画面左の「実行数」を開き、赤い「失敗」の行がないかご確認ください。エラーの文面を教えていただければ原因をお調べします。</p></div>`;
  }, 15000);
  try {
    S.boot = await call('bootstrap');
    clearTimeout(slow);
  } catch (e) {
    clearTimeout(slow);
    $('#main').innerHTML = `<div class="note warn">起動できませんでした：${esc(e.message || e)}</div>`; return;
  }
  S.year = S.boot.settings.year;
  const ys = $('#year'), cy = new Date().getFullYear();
  const years = []; for (let y = cy + 1; y >= cy - 5; y--) years.push(y);
  if (!years.includes(S.year)) years.push(S.year);
  ys.innerHTML = years.map(y => `<option ${y === S.year ? 'selected' : ''}>${y}</option>`).join('');
  ys.onchange = async () => { S.year = Number(ys.value); call('saveSettings', { year: S.year }).catch(() => { }); go(S.view); };
  LEDGER_UI.mount();
  $('.tools a[data-view=settings]').innerHTML = icon('gear');
  renderNav();
  applyFont(S.boot.settings.fontScale);
  $('#fsBtn').onclick = () => {
    const next = { m: 'l', l: 'xl', xl: 'm' }[S.boot.settings.fontScale] || 'l';
    S.boot.settings.fontScale = next; applyFont(next);
    call('saveSettings', { fontScale: next }).catch(() => { });
    toast('文字の大きさ：' + { m: '標準', l: '大', xl: '特大' }[next]);
  };
  setBadge(S.boot.pending);
  go(S.boot.pending ? 'inbox' : 'home');
})();
</script>

          <button class="ez-choice ${st[key] === ymd(y) ? 'sel' : ''}" data-d="${ymd(y)}"><div><b>きのう</b><span>${jpDate(ymd(y))}</span></div></button>
          <label class="ez-choice" style="cursor:pointer"><div style="flex:1"><b>日にちを選ぶ</b><span id="ezPick">${st[key] && st[key] !== ymd(t) && st[key] !== ymd(y) ? jpDate(st[key]) : 'カレンダーから選べます'}</span></div>
            <input type="date" id="ezDate" value="${st[key] || ymd(t)}" max="${ymd(t)}" style="width:150px;min-height:48px;border:2px solid #E3E5F0;border-radius:14px;padding:0 8px;background:#fff"></label></div>`;
        $$('[data-d]', body).forEach(b => b.onclick = () => { st[key] = b.dataset.d; next(); });
        $('#ezDate', body).onchange = e => { if (e.target.value) { st[key] = e.target.value; next(); } };
      }
    };
  }

  /* ───────── お金を払った ───────── */
  function payFlow() {
    const accs = ((typeof S !== 'undefined' && S.boot && S.boot.accounts) || []).filter(a => a.active && (a.type === '費用' || a.code === '501'));
    flow([
      {
        q: () => '何にお金を使いましたか？', hint: () => 'いちばん近いものを押してください。',
        render(body, st, next) {
          choices(body, PAY_KINDS.map(k => ({ v: k.acc, t: k.t, d: k.d, art: k.art(50) })), st.acc, it => {
            if (it.v) { st.acc = it.v; st.kind = it.t; return next(); }
            body.innerHTML = `<div class="ez-list">${accs.map(a => `<button class="ez-row" data-a="${a.code}"><div class="tx"><b>${H(a.name)}</b></div><span class="chev">›</span></button>`).join('')}</div>`;
            $$('[data-a]', body).forEach(b => b.onclick = () => { st.acc = b.dataset.a; st.kind = accs.find(a => a.code === st.acc).name; next(); });
          }, { col: true });
        }
      },
      { q: st => `${H(st.kind)}に、いくら払いましたか？`, hint: () => 'レシートの合計の金額を押してください。', render(body, st, next) { keypad(body, st.amount, { unit: '円' }, n => { st.amount = n; next(); }); } },
      {
        q: () => 'どのお金で払いましたか？',
        render(body, st, next) { choices(body, PAY_FROM.map(p => ({ v: p.acc, t: p.t, d: p.d, art: p.art })), st.from, it => { st.from = it.v; st.fromName = it.t; next(); }, { one: true }); }
      },
      dateStep(),
      {
        q: () => 'これで記録しますか？', hint: () => 'まちがいがあれば「直す」を押してください。',
        render(body, st) {
          body.innerHTML = `<div class="ez-confirm">
            <div class="r total"><span>金額</span><b>${Y(st.amount)}円</b><button data-s="1">直す</button></div>
            <div class="r"><span>使いみち</span><b>${H(st.kind)}</b><button data-s="0">直す</button></div>
            <div class="r"><span>払ったお金</span><b>${H(st.fromName)}</b><button data-s="2">直す</button></div>
            <div class="r"><span>日にち</span><b>${jpDate(st.date)}</b><button data-s="3">直す</button></div>
            <label class="r" style="display:block"><span style="display:block;margin-bottom:6px">どこで？（書かなくても大丈夫）</span>
              <input id="ezMemo" value="${H(st.memo || '')}" placeholder="例：郵便局、ダイソー" style="width:100%;min-height:54px;border:2px solid #E3E5F0;border-radius:16px;padding:0 14px;font-size:18px"></label></div>`;
          $$('[data-s]', body).forEach(b => b.onclick = () => step(Number(b.dataset.s)));
          const c = cta(`<button class="ez-btn jade" id="ezSave">${IC.check.replace('<svg', '<svg width="26" height="26"')}記録する</button>`);
          $('#ezSave', c).onclick = async () => {
            st.memo = $('#ezMemo').value.trim();
            $('#ezSave', c).disabled = true;
            try {
              await call('addEntry', { date: st.date, debit: st.acc, credit: st.from, amount: st.amount, ratio: 100, memo: [st.kind, st.memo].filter(Boolean).join('：'), partner: st.memo });
              done(`${Y(st.amount)}円を記録しました`, `${jpDate(st.date)}・${st.kind}`, payFlow);
            } catch (e) { $('#ezSave', c).disabled = false; toast(e.message || String(e), true); }
          };
        }
      }
    ], { date: ymd(new Date()) });
  }

  /* ───────── 石を仕入れた ───────── */
  async function stoneNames() {
    const [dict, st, dates] = await Promise.all([call('stoneDict'), call('salesStats', { year: year() }), call('inventoryDates')]);
    const count = {};
    (st.byStone || []).forEach(s => { count[s.name] = (count[s.name] || 0) + s.count * 3; });
    if (dates[0]) { const inv = await call('inventory', { date: dates[0].date }); inv.rows.forEach(r => { count[r.item] = (count[r.item] || 0) + 1; }); }
    (dict.names || []).forEach(n => { count[n] = count[n] || 0; });
    delete count['その他']; delete count[''];
    return Object.keys(count).sort((a, b) => count[b] - count[a]);
  }
  async function buyFlow() {
    root.innerHTML = '<div class="ez-load">読み込んでいます…</div>';
    const names = await stoneNames();
    flow([
      {
        q: () => 'どの石を仕入れましたか？', hint: () => 'よく使う石が上に並んでいます。',
        render(body, st, next) {
          body.innerHTML = `<label class="ez-search">${IC.search}<input id="ezQ" placeholder="石の名前でさがす" autocomplete="off"></label><div class="ez-stones" id="ezStones"></div>`;
          const draw = q => {
            const qq = q.normalize('NFKC').trim();
            let list = names.filter(n => !qq || n.includes(qq));
            const extra = qq && !names.includes(qq) ? `<button class="ez-stone" data-n="${H(qq)}">${gem(qq, 50)}<b>「${H(qq)}」で記録</b></button>` : '';
            $('#ezStones', body).innerHTML = extra + list.slice(0, 30).map(n => `<button class="ez-stone ${st.stone === n ? 'sel' : ''}" data-n="${H(n)}">${gem(n, 50)}<b>${H(n)}</b></button>`).join('');
            $$('[data-n]', body).forEach(b => b.onclick = () => { st.stone = b.dataset.n; b.classList.add('sel'); setTimeout(next, 140); });
          };
          $('#ezQ', body).oninput = e => draw(e.target.value);
          draw('');
        }
      },
      {
        q: st => `${H(st.stone)}の、どんな形ですか？`,
        render(body, st, next) { choices(body, SHAPES.map(s => ({ v: s.k, t: s.k, d: s.d, art: s.art(st.stone) })), st.shape, it => { st.shape = it.v; next(); }, { col: true }); }
      },
      {
        q: () => '大きさは何ミリですか？', hint: () => 'わからなければ「わからない」を押してください。',
        render(body, st, next) {
          const sizes = st.shape === '勾玉' ? [15, 18, 20, 22, 25, 30, 35, 40, 45, 50, 60] : [4, 6, 8, 10, 12, 14, 16, 18, 20];
          body.innerHTML = `<div class="ez-chips">${sizes.map(s => `<button class="ez-chip ${st.mm === s ? 'sel' : ''}" data-m="${s}">${s}mm</button>`).join('')}
            <button class="ez-chip ghost" data-m="">わからない</button></div>`;
          $$('[data-m]', body).forEach(b => b.onclick = () => { st.mm = b.dataset.m ? Number(b.dataset.m) : ''; next(); });
        }
      },
      { q: () => '何個ですか？', hint: () => '数字を押すか、＋−で合わせてください。', render(body, st, next) { keypad(body, st.qty, { unit: '個', stepper: true }, n => { st.qty = n; next(); }); } },
      {
        q: () => '全部でいくらでしたか？', hint: () => '送料も含めた、払った合計です。',
        render(body, st, next) { keypad(body, st.amount, { unit: '円', sub: n => n && st.qty ? `1個あたり 約${Y(n / st.qty)}円` : '' }, n => { st.amount = n; next(); }); }
      },
      {
        q: () => 'どのお金で払いましたか？',
        render(body, st, next) {
          const items = PAY_FROM.map(p => ({ v: p.acc, t: p.t, d: p.d, art: p.art })).concat([{ v: 'none', t: 'もう記録してある', d: 'カード明細などで記録ずみ', art: emo('✅', 'jade', 50) }]);
          choices(body, items, st.from, it => { st.from = it.v; st.fromName = it.t; next(); }, { one: true });
        }
      },
      dateStep(),
      {
        q: () => 'これで記録しますか？', hint: () => 'まちがいがあれば「直す」を押してください。',
        render(body, st) {
          const size = st.shape + (st.mm ? ' ' + st.mm + 'mm' : '');
          body.innerHTML = `<div style="display:flex;align-items:center;gap:14px;margin:0 2px 14px">${st.shape === '勾玉' ? magatama(st.stone, 64) : gem(st.stone, 60)}<div><b style="font-size:22px">${H(st.stone)}</b><div style="color:#7B82A0">${H(size)}</div></div></div>
            <div class="ez-confirm">
              <div class="r total"><span>合計</span><b>${Y(st.amount)}円</b><button data-s="4">直す</button></div>
              <div class="r"><span>個数</span><b>${Y(st.qty)}個（1個 約${Y(st.amount / st.qty)}円）</b><button data-s="3">直す</button></div>
              <div class="r"><span>払ったお金</span><b>${H(st.fromName)}</b><button data-s="5">直す</button></div>
              <div class="r"><span>日にち</span><b>${jpDate(st.date)}</b><button data-s="6">直す</button></div>
              <label class="r" style="display:block"><span style="display:block;margin-bottom:6px">どこで買った？（書かなくても大丈夫）</span>
                <input id="ezMemo" value="${H(st.memo || '')}" placeholder="例：〇〇ビーズ、メルカリ" style="width:100%;min-height:54px;border:2px solid #E3E5F0;border-radius:16px;padding:0 14px;font-size:18px"></label></div>`;
          $$('[data-s]', body).forEach(b => b.onclick = () => step(Number(b.dataset.s)));
          const c = cta(`<button class="ez-btn jade" id="ezSave">${IC.check.replace('<svg', '<svg width="26" height="26"')}記録する</button>`);
          $('#ezSave', c).onclick = async () => {
            st.memo = $('#ezMemo').value.trim();
            $('#ezSave', c).disabled = true;
            try {
              await call('addLots', { date: st.date, kind: '仕入', lines: [{ stone: st.stone, size, qty: st.qty, amount: st.amount }], partner: st.memo, note: st.memo,
                extra: 0, credit: st.from === 'none' ? '' : st.from, makeEntry: st.from !== 'none' });
              done(`${H(st.stone)}を${Y(st.qty)}個 記録しました`, `${jpDate(st.date)}・${Y(st.amount)}円`, buyFlow);
            } catch (e) { $('#ezSave', c).disabled = false; toast(e.message || String(e), true); }
          };
        }
      }
    ], { date: ymd(new Date()) });
  }

  function done(title, sub, again) {
    E.flow = null;
    root.innerHTML = `<div class="ez-wrap"><div class="ez-done"><div class="ok">${IC.check}</div><h2>${title}</h2><p>${H(sub)}</p><p style="font-size:15px">帳簿にも自動で入りました。</p></div></div>`;
    const c = cta(`<button class="ez-btn sub" id="ezHome">ホームへ</button><button class="ez-btn" id="ezAgain">続けて記録する</button>`);
    $('#ezHome', c).onclick = () => show('home');
    $('#ezAgain', c).onclick = again;
  }

  /* ───────── 在庫 ───────── */
  VIEWS.stock = async () => {
    const dates = await call('inventoryDates');
    const last = dates[0];
    const inv = last ? await call('inventory', { date: last.date }) : { rows: [] };
    const rows = inv.rows.map(r => Object.assign({}, r, { qty0: Number(r.qty) || 0, qty: Number(r.qty) || 0 }));
    E.data.stockRows = rows;
    const groups = {};
    rows.forEach((r, i) => { (groups[r.item || 'その他'] = groups[r.item || 'その他'] || []).push(i); });
    const names = Object.keys(groups).sort((a, b) => groups[b].reduce((s, i) => s + rows[i].qty, 0) - groups[a].reduce((s, i) => s + rows[i].qty, 0));
    const total = rows.reduce((s, r) => s + r.qty, 0);
    root.innerHTML = `
      <div class="ez-top"><div class="ez-hello"><b>在庫</b><span>${last ? `${jpDate(last.date)}に数えた数・全部で ${Y(total)}個` : 'まだ数えた記録がありません'}</span></div></div>
      <div class="ez-wrap">
        ${last ? `<p class="ez-hint" style="margin-top:8px">石を押すと、大きさごとの数が出ます。数が違っていたら −／＋ で直して「保存する」を押してください。</p>
          ${names.map(n => `<div class="ez-stock" data-n="${H(n)}"><button aria-expanded="false">${groups[n].some(i => /勾玉/.test(rows[i].spec)) && !groups[n].some(i => /丸玉/.test(rows[i].spec)) ? magatama(n, 52) : gem(n, 50)}
              <div class="tx"><b>${H(n)}</b><span>${groups[n].length}種類の大きさ</span></div><div class="n" data-sum>${Y(groups[n].reduce((s, i) => s + rows[i].qty, 0))}<small>個</small></div></button>
              <div class="sizes" hidden>${groups[n].map(i => `<div class="ez-size" data-i="${i}"><div class="nm">${H(rows[i].spec || '大きさの記録なし')}<span>${rows[i].unit_cost ? `1個 ${Y(rows[i].unit_cost)}円` : ''}</span></div>
                <button data-d="-1" aria-label="1つ減らす">−</button><input inputmode="numeric" value="${rows[i].qty}" aria-label="${H(n)} ${H(rows[i].spec)} の数"><button data-d="1" aria-label="1つ増やす">＋</button></div>`).join('')}</div></div>`).join('')}`
        : `<div class="ez-list" style="margin-top:14px"><div class="ez-empty"><div style="display:flex;justify-content:center;margin-bottom:10px">${ART.stock(80)}</div>在庫の数は、パソコンの「くわしい画面」の棚卸から一度まとめて入れると、ここで見たり直したりできます。</div></div>`}
      </div>`;
    $$('.ez-stock > button', root).forEach(b => b.onclick = () => { const s = b.nextElementSibling; s.hidden = !s.hidden; b.setAttribute('aria-expanded', String(!s.hidden)); });
    const changed = () => {
      const n = rows.filter(r => r.qty !== r.qty0).length;
      root.style.paddingBottom = n ? 'calc(190px + env(safe-area-inset-bottom))' : '';
      if (!n) return ctaOff();
      if (!$('#ezCta')) {
        const c = cta(`<button class="ez-btn sub" id="ezUndo">元に戻す</button><button class="ez-btn" id="ezSaveInv">保存する</button>`, true);
        $('#ezUndo', c).onclick = () => show('stock');
        $('#ezSaveInv', c).onclick = saveStock;
      }
      $('#ezSaveInv').textContent = `${n}か所を保存する`;
    };
    $$('.ez-size', root).forEach(el => {
      const r = rows[Number(el.dataset.i)], inp = $('input', el);
      const set = v => {
        r.qty = Math.max(0, Math.round(Number(v) || 0)); inp.value = r.qty; el.classList.toggle('chg', r.qty !== r.qty0);
        const card = el.closest('.ez-stock'), idx = groups[card.dataset.n];
        $('[data-sum]', card).innerHTML = `${Y(idx.reduce((s, i) => s + rows[i].qty, 0))}<small>個</small>`;
        changed();
      };
      $$('button', el).forEach(b => b.onclick = () => set(r.qty + Number(b.dataset.d)));
      inp.onchange = () => set(inp.value.normalize('NFKC'));
    });
  };
  async function saveStock() {
    const rows = E.data.stockRows.map(r => ({ category: r.category, item: r.item, spec: r.spec, unit: r.unit, qty: r.qty, unit_cost: r.unit_cost, note: r.note }));
    const today = ymd(new Date());
    try {
      await call('saveInventory', { date: today, rows });
      toast(`在庫を保存しました（${jpDate(today)}の数として残しました）`);
      show('stock');
    } catch (e) { toast(e.message || String(e), true); }
  }

  /* ───────── 売れた石 ───────── */
  VIEWS.best = async () => {
    E.data.bestPeriod = E.data.bestPeriod || 'year';
    const m = new Date().getMonth() + 1;
    const st = await call('salesStats', E.data.bestPeriod === 'month' ? { year: year(), month: m } : { year: year() });
    const list = (st.byStone || []).filter(s => s.name && s.name !== 'その他').concat((st.byStone || []).filter(s => s.name === 'その他'));
    const max = Math.max(1, ...list.map(s => s.price));
    root.innerHTML = `
      <div class="ez-top"><div class="ez-hello"><b>売れた石</b><span>${E.data.bestPeriod === 'month' ? m + '月' : year() + '年'}に ${Y(st.total.count)}個・${Y(st.total.price)}円</span></div></div>
      <div class="ez-wrap">
        <div class="ez-seg" role="tablist"><button data-p="month" class="${E.data.bestPeriod === 'month' ? 'on' : ''}">今月</button><button data-p="year" class="${E.data.bestPeriod === 'year' ? 'on' : ''}">今年</button></div>
        ${list.length ? list.map((s, k) => `<button class="ez-rank" data-k="${k}"><span class="no ${k < 3 ? 'g' + (k + 1) : ''}">${k + 1}</span>${gem(s.name, 46)}
          <div class="tx"><b>${H(s.name)}</b><div class="bar"><i style="width:${Math.max(4, s.price / max * 100)}%"></i></div></div>
          <div class="v"><b>${Y(s.price)}円</b><span>${Y(s.count)}個</span></div></button>`).join('')
        : '<div class="ez-list"><div class="ez-empty">この期間に売れた記録はまだありません。<br>ヤフオクやメルカリの売上を取り込むと、ここに並びます。</div></div>'}
      </div>`;
    $$('[data-p]', root).forEach(b => b.onclick = () => { E.data.bestPeriod = b.dataset.p; show('best'); });
    $$('.ez-rank', root).forEach(b => b.onclick = () => stoneSheet(list[Number(b.dataset.k)]));
  };
  function stoneSheet(s) {
    sheet(`<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">${gem(s.name, 64)}<div><b style="font-size:24px">${H(s.name)}</b>
        <div style="color:#7B82A0">${Y(s.count)}個売れて ${Y(s.price)}円・平均 ${Y(s.avg)}円</div></div></div>
      <h3 class="ez-h" style="margin-top:6px">最近売れたもの</h3>
      <div class="ez-list">${(s.recent || []).map(r => `<div class="ez-row"><div class="ic">${r.shape === '勾玉' ? magatama(s.name, 30) : gem(s.name, 28)}</div>
        <div class="tx"><b>${H(String(r.title || '').replace(/[【】★☆]/g, ' ').trim())}</b><span>${jpDate(r.date)}・${H(r.site)}</span></div><div class="amt">${Y(r.price)}円</div></div>`).join('')}</div>`);
  }

  /* ───────── 下から出る画面 ───────── */
  function sheet(html) {
    closeSheet();
    const m = document.createElement('div'); m.className = 'ez-sheet'; m.id = 'ezSheet';
    m.innerHTML = `<div class="pane" role="dialog" aria-modal="true"><div class="grab"></div>${html}
      <button class="ez-btn sub" id="ezClose" style="width:100%;margin-top:16px;flex:none">閉じる</button></div>`;
    document.body.appendChild(m);
    m.onclick = e => { if (e.target === m) closeSheet(); };
    $('#ezClose', m).onclick = closeSheet;
    return m;
  }
  function closeSheet() { const m = $('#ezSheet'); if (m) m.remove(); }
  function addSheet() {
    const m = sheet(`<h2 class="ez-q" style="margin-top:0">何を記録しますか？</h2>
      <div class="ez-choices one">
        <button class="ez-choice" data-a="pay"><div class="art">${ART.pay(56)}</div><div><b>お金を払った</b><span>送料・道具・交通費など</span></div></button>
        <button class="ez-choice" data-a="buy"><div class="art">${ART.buy(56)}</div><div><b>石を仕入れた</b><span>買った石の種類・数・金額</span></div></button>
      </div>`);
    $$('[data-a]', m).forEach(b => b.onclick = () => { closeSheet(); b.dataset.a === 'pay' ? payFlow() : buyFlow(); });
  }
  function moreSheet() {
    const L = window.LEDGER || {};
    const m = sheet(`<h2 class="ez-q" style="margin-top:0">そのほか</h2>
      <div class="ez-list">
        <button class="ez-row" data-a="sales">${ART.import(48)}<div class="tx"><b>売上を取り込む</b><span>ヤフオク・メルカリの売上</span></div><span class="chev">›</span></button>
        <button class="ez-row" data-a="full">${emo('📖', 'gray', 48)}<div class="tx"><b>くわしい画面にする</b><span>帳簿・決算書・設定など、すべての機能</span></div><span class="chev">›</span></button>
        <button class="ez-row" data-a="help">${emo('❓', 'fuji', 48)}<div class="tx"><b>使い方</b><span>困ったときに</span></div><span class="chev">›</span></button>
        ${L.mode === 'cloud' ? `<button class="ez-row" data-a="out">${emo('🚪', 'rose', 48)}<div class="tx"><b>ログアウト</b><span>${H(L.user)} でログイン中</span></div><span class="chev">›</span></button>` : ''}
      </div>`);
    $$('[data-a]', m).forEach(b => b.onclick = () => {
      const a = b.dataset.a; closeSheet();
      if (a === 'full') leave();
      else if (a === 'sales') { leave(); setMode('easy'); setTimeout(() => window.go && window.go('sales'), 50); backPill(); }
      else if (a === 'help') helpSheet();
      else if (a === 'out' && window.LEDGER_UI) window.LEDGER_UI.logout();
    });
  }
  function helpSheet() {
    sheet(`<h2 class="ez-q" style="margin-top:0">使い方</h2>
      <div class="ez-list">
        <div class="ez-row">${ART.pay(48)}<div class="tx" style="white-space:normal"><b>お金を払ったとき</b><span style="display:block">「お金を払った」を押して、質問に答えるだけです。レシートは捨てずに取っておいてください。</span></div></div>
        <div class="ez-row">${ART.buy(48)}<div class="tx"><b>石を買ったとき</b><span style="display:block;white-space:normal">「石を仕入れた」で、石・形・大きさ・個数・金額を入れます。在庫や1個の値段が自動でわかります。</span></div></div>
        <div class="ez-row">${ART.stock(48)}<div class="tx"><b>在庫を数えたとき</b><span style="display:block;white-space:normal">「在庫」で数を −／＋ で直して保存します。年末（12月31日）にもう一度数えると安心です。</span></div></div>
      </div>
      <p class="ez-hint" style="margin-top:14px">記録したものは、まちがえても「くわしい画面」の帳簿から取り消せます。わからないときは、無理に進めずにそのままにしておいて大丈夫です。</p>`);
  }
  /** くわしい画面から、かんたん画面へ戻るボタン */
  function backPill() {
    if ($('#ezBackPill')) return;
    const b = document.createElement('button');
    b.id = 'ezBackPill'; b.type = 'button'; b.textContent = 'かんたん画面にもどる';
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:29;border:0;border-radius:999px;padding:14px 22px;font:700 17px/1 inherit;color:#fff;background:#1E2A5A;box-shadow:0 12px 24px -12px rgba(30,42,90,.8)';
    b.onclick = () => { b.remove(); enter(); };
    document.body.appendChild(b);
  }

  /* くわしい画面のメニューに「かんたん画面」を足す */
  new MutationObserver(() => {
    const ms = document.getElementById('moreSheet');
    if (ms && !ms.querySelector('.ez-switch')) {
      const host = ms.querySelector('div') || ms;
      const b = document.createElement('a');
      b.className = 'ez-switch'; b.href = '#';
      b.innerHTML = '<span style="font-weight:700">かんたん画面にする</span>';
      b.style.cssText = 'display:block;padding:16px 18px;margin:0 0 8px;border-radius:16px;background:#ECE9FC;color:#3E2FA6;text-decoration:none;font-size:17px';
      b.onclick = e => { e.preventDefault(); enter(); };
      host.insertBefore(b, host.firstChild);
    }
  }).observe(document.body, { childList: true, subtree: true });

  window.EASY = { enter, leave };

  /* 起動：スマホでは最初からかんたん画面（くわしい画面を選んだ人はそのまま） */
  const wait = setInterval(() => {
    if (!(typeof S !== 'undefined' && S.boot)) return;
    clearInterval(wait);
    const m = getMode();
    if (m === 'easy' || (!m && window.matchMedia('(max-width: 720px)').matches)) enter();
  }, 120);
})();

</script>
</body>
</html>
