<!DOCTYPE html>
<html lang="ja">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>青色帳簿</title>
  <meta name="description" content="個人事業主・天然石ショップ向けの青色申告帳簿（ブラウザだけで動きます）">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #eceef5;
  --surface: #ffffff;
  --surface-2: #f6f7fb;
  --ink: #15161f;
  --ink-2: #5d6070;
  --muted: #9a9dad;
  --line: #e9eaf1;
  --primary: #5b4cf0;
  --primary-2: #7a6bff;
  --primary-soft: #efedff;
  --dark: #1b1c29;
  --dark-2: #262839;
  --dark-3: #33354a;
  --green: #12a150;
  --green-soft: #e3f6ea;
  --red: #e5484d;
  --red-soft: #fdecec;
  --amber: #d97706;
  --amber-soft: #fdf3e2;
  --sans: 'Plus Jakarta Sans', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --jp: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 12px;
  --shadow: 0 1px 2px rgba(21, 22, 31, .04), 0 10px 30px -18px rgba(37, 30, 120, .25);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--jp); font-size: 16px; line-height: 1.7; }
body { -webkit-font-smoothing: antialiased; padding: 18px; }
a { color: var(--primary); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .serif-num, .kpi .value, h1 { font-family: var(--sans); }

/* ───── shell ───── */
.shell { background: var(--surface-2); border-radius: 32px; min-height: calc(100vh - 36px); padding: 22px 30px 50px; box-shadow: 0 30px 60px -40px rgba(30, 25, 90, .35); max-width: 1480px; margin: 0 auto; }
.top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px 20px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 14px -6px var(--primary); }
.logo svg { width: 24px; height: 24px; }
.brand-name { font-weight: 700; font-size: 19px; letter-spacing: .02em; line-height: 1.2; }
.brand-sub { font-family: var(--sans); font-size: 12px; color: var(--muted); }

.pillnav { grid-column: 1 / -1; grid-row: 2; justify-self: center; display: flex; gap: 4px; background: var(--dark); padding: 5px; border-radius: 999px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.pillnav::-webkit-scrollbar { display: none; }
.pillnav a { color: #d8d9e6; padding: 10px 18px; border-radius: 999px; font-size: 15.5px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.pillnav a:hover { color: #fff; background: var(--dark-3); }
.pillnav a.on { background: var(--primary); color: #fff; box-shadow: 0 6px 14px -6px var(--primary); }
.pillnav a svg { width: 18px; height: 18px; opacity: .85; }
.badge { background: var(--red); color: #fff; font-family: var(--sans); font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 99px; min-width: 22px; line-height: 20px; text-align: center; }
.tools { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); cursor: pointer; }
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.txt { width: auto; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 15px; gap: 6px; display: inline-flex; align-items: center; }
.year-pill select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 32px 0 16px; height: 48px; min-height: 48px; font-size: 16px; font-family: var(--sans); font-weight: 700; width: auto; }

#subnav { display: flex; justify-content: center; margin-top: 16px; }
#subnav:empty { display: none; }
.subtabs { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.subtabs a { padding: 9px 20px; border-radius: 999px; color: var(--ink-2); font-size: 15.5px; cursor: pointer; white-space: nowrap; }
.subtabs a.on { background: var(--primary-soft); color: var(--primary); font-weight: 700; }

main { padding-top: 26px; min-width: 0; }

/* ───── headings ───── */
.head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.head > div:first-child { display: flex; flex-direction: column; }
h1 { font-size: 34px; font-weight: 800; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
h1 .muted { font-size: 20px; font-weight: 600; }
h2 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
.lead { color: var(--ink-2); margin: 6px 0 0; font-size: 15.5px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.hint { font-size: 13.5px; color: var(--muted); margin-top: 2px; min-height: 1.2em; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.serif-num { font-weight: 800; font-variant-numeric: tabular-nums; }

/* ───── cards ───── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.two { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 132px; }
.kpi .label { font-size: 15px; color: var(--ink); font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .value { font-weight: 800; font-size: 32px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: 8px; line-height: 1.15; }
.kpi .value small { font-size: 14px; margin-left: 3px; color: var(--muted); font-weight: 600; }
.kpi .delta { font-size: 14px; color: var(--muted); margin-top: 4px; }
.kpi .delta b { font-family: var(--sans); }
.kpi .delta .up { color: var(--green); }
.kpi .delta .down { color: var(--red); }
.kpi .spark { margin-top: auto; padding-top: 10px; }
.kpi .spark svg { width: 100%; height: 64px; display: block; }
.kpi.warn { cursor: pointer; }
.ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ico svg { width: 18px; height: 18px; }
.ico.p { background: var(--primary-soft); color: var(--primary); }
.ico.r { background: var(--red-soft); color: var(--red); }
.ico.g { background: var(--green-soft); color: var(--green); }
.ico.a { background: var(--amber-soft); color: var(--amber); }

/* ───── dark panel + purple detail ───── */
.panel { background: var(--dark); border-radius: 28px; padding: 22px; color: #e9e9f3; display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; position: relative; box-shadow: 0 30px 50px -35px rgba(20, 20, 50, .7); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-title { font-weight: 700; font-size: 18px; color: #fff; }
.plist { display: flex; flex-direction: column; gap: 6px; max-height: 560px; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--dark-3) transparent; }
.pitem { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 16px; cursor: pointer; border: 1px solid transparent; }
.pitem:hover { background: var(--dark-2); }
.pitem.on { background: linear-gradient(135deg, var(--primary-2), var(--primary)); box-shadow: 0 10px 20px -12px var(--primary); }
.pitem .av { width: 44px; height: 44px; border-radius: 50%; background: var(--dark-3); display: grid; place-items: center; font-weight: 700; font-size: 17px; color: #fff; }
.pitem.on .av { background: rgba(255, 255, 255, .22); }
.pitem .t1 { font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
.pitem .t2 { font-size: 13.5px; color: #9ea0b8; }
.pitem.on .t2 { color: #e2defd; }
.pitem .amt { font-family: var(--sans); font-weight: 700; text-align: right; color: #fff; font-size: 17px; }
.pitem .st { font-size: 12.5px; display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--dark-3); color: #c6c8dd; margin-top: 2px; }
.pitem.on .st { background: #fff; color: var(--primary); font-weight: 700; }
.pempty { color: #9ea0b8; padding: 30px 10px; text-align: center; }

.detail { background: linear-gradient(140deg, #7466ff 0%, #5b4cf0 55%, #4d3fe0 100%); border-radius: 24px; padding: 24px; color: #fff; display: flex; flex-direction: column; gap: 18px; position: relative; overflow: hidden; }
.detail::after { content: ''; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .16), transparent 70%); pointer-events: none; }
.detail .lbl { font-size: 15px; color: #dcd8ff; }
.detail .big { font-family: var(--sans); font-size: 32px; font-weight: 800; letter-spacing: -.01em; }
.detail .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.glass { background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .16); border-radius: 18px; padding: 14px 16px; backdrop-filter: blur(4px); position: relative; }
.glass .v { font-family: var(--sans); font-weight: 800; font-size: 23px; }
.glass .k { font-size: 14.5px; color: #e4e1ff; margin-top: 2px; }
.glass .arr { position: absolute; right: 12px; top: 10px; opacity: .7; }
.heroKpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.glass.dash { border-style: dashed; background: transparent; display: grid; place-items: center; text-align: center; cursor: pointer; }
.detail-foot { border-top: 1px solid rgba(255, 255, 255, .18); padding-top: 16px; display: flex; gap: 26px; align-items: flex-end; flex-wrap: wrap; }
.detail-foot .v { font-family: var(--sans); font-weight: 800; font-size: 21px; }
.detail-foot .k { font-size: 13.5px; color: #dcd8ff; }
.detail-foot .sp { flex: 1; }
.detail select, .detail input { background: rgba(255, 255, 255, .95); color: var(--ink); border: 0; }
.detail .chipset { display: flex; flex-wrap: wrap; gap: 8px; }
.detail .achip { border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .08); color: #fff; border-radius: 999px; padding: 9px 18px; cursor: pointer; font-size: 16px; }
.detail .achip:hover { background: rgba(255, 255, 255, .18); }
.detail .achip.on { background: #fff; color: var(--primary); font-weight: 700; border-color: #fff; }
.detail .achip small { opacity: .7; margin-left: 4px; }
.btn.white { background: #fff; color: var(--ink); border-color: #fff; font-weight: 700; }
.btn.white:hover { color: var(--primary); }
.btn.glassbtn { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .25); }
.btn.glassbtn:hover { background: rgba(255, 255, 255, .22); border-color: #fff; }
.kbd { font-family: var(--sans); font-size: 12px; border: 1px solid rgba(255, 255, 255, .35); border-radius: 6px; padding: 0 5px; margin-left: 6px; opacity: .8; }
.range { width: 100%; accent-color: #fff; }

/* tabs over panel */
.ptabs { display: inline-flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); }
.ptabs button { border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 15px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.ptabs button.on { background: var(--primary); color: #fff; }
.ptabs .cnt { font-family: var(--sans); font-size: 12.5px; background: var(--surface-2); color: var(--ink-2); border-radius: 99px; padding: 0 7px; }
.ptabs button.on .cnt { background: #fff; color: var(--primary); }

/* filter bar */
.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.filters .lbl { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.filters .lbl .cnt { background: var(--dark); color: #fff; font-family: var(--sans); font-size: 12.5px; border-radius: 99px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; padding: 0 6px; }
.filters select, .filters input:not([type]) { width: auto; min-width: 160px; border-radius: 999px; background: var(--surface); }

/* ───── forms ───── */
label.f { display: flex; flex-direction: column; gap: 7px; font-size: 15px; color: var(--ink); font-weight: 700; }
input[type=text], input[type=date], input[type=number], input[type=password], input:not([type]), select, textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 10px 14px; min-height: 50px; width: 100%; font-size: 16px; font-weight: 400; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
input[type=file] { font-size: 15px; font-weight: 400; }
input[type=file]::file-selector-button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 10px 18px; margin-right: 12px; cursor: pointer; font: inherit; font-weight: 700; }
input[type=checkbox] { accent-color: var(--primary); width: 20px; height: 20px; flex: none; }
.form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); align-items: start; }
.form .wide { grid-column: span 2; }
.form.jf { grid-template-columns: 150px 230px 1fr auto; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 22px; min-height: 50px; font-size: 16px; cursor: pointer; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; justify-content: center; transition: .15s; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 8px 18px -10px var(--primary); }
.btn.primary:hover { background: #4c3de0; color: #fff; }
.btn.dark { background: var(--dark); color: #fff; border-color: var(--dark); }
.btn.dark:hover { background: var(--dark-3); color: #fff; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 14px; min-height: 38px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 19px; height: 19px; }
.seg { display: inline-flex; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 4px; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 9px 20px; font-size: 16px; cursor: pointer; border-radius: 999px; color: var(--ink-2); }
.seg button.on { background: var(--primary); color: #fff; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 16px; font-size: 14.5px; cursor: pointer; }
.chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.switch { display: inline-flex; gap: 10px; align-items: center; cursor: pointer; min-height: 50px; font-weight: 400; }

/* ───── tables ───── */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 13.5px; font-weight: 700; color: var(--ink-2); text-align: left; background: var(--surface); position: sticky; top: 0; z-index: 1; white-space: nowrap; letter-spacing: .02em; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #fafaff; }
td select { min-width: 150px; }
tr.total td { font-weight: 700; background: var(--surface-2); }
tr.sub td { color: var(--ink-2); }
tr.dim td { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(154, 157, 173, .6); }
.tag { display: inline-block; font-size: 13px; padding: 3px 11px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; border: 1px solid var(--line); }
.tag.out { background: var(--red-soft); color: var(--red); border-color: transparent; }
.tag.in { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.tag.ok { background: var(--green-soft); color: var(--green); border-color: transparent; }
.tag.warn { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.lines div { display: flex; justify-content: space-between; gap: 14px; }
.ellipsis { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.csv th { text-align: center; }
.csv td { font-size: 14px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.csv td.hd { color: var(--muted); }
.csv th.mapped { background: var(--primary-soft); color: var(--primary); }
.stmt td:first-child { padding-left: 22px; }
.stmt tr.h td { font-weight: 700; background: var(--surface-2); padding-left: 14px; }
.bs { grid-template-columns: 1fr 1fr; }
.preview td { padding: 7px 12px; }
.lines-editor td { padding: 6px 8px; }
.lines-editor input { text-align: right; }
.bal { font-weight: 700; }
.bal.ok { color: var(--green); }
.bal.ng { color: var(--red); }
.inv td input, .inv td select { min-height: 44px; padding: 6px 10px; }
.inv td.amt { min-width: 90px; }

/* ───── notices ───── */
.note { background: var(--primary-soft); color: #3a2fb0; padding: 14px 18px; border-radius: var(--r-sm); font-size: 15.5px; margin: 0 0 16px; }
.note.warn { background: var(--amber-soft); color: #8a4b05; }
.note.ok { background: var(--green-soft); color: #0e6a37; }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }
.empty .big { font-size: 21px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 16px; font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* onboarding */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; background: var(--surface); }
.step:hover { border-color: var(--primary); }
.step .n { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-family: var(--sans); font-weight: 800; font-size: 14px; flex: none; }
.step.done .n { background: var(--green); color: #fff; }
.step .t { font-weight: 700; font-size: 16px; }
.step .d { font-size: 14px; color: var(--muted); }

/* toast & busy */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--dark); color: #fff; padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .25s; max-width: 90vw; z-index: 50; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .4); font-size: 16px; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: var(--red); }
#busy { position: fixed; inset: 0; background: rgba(236, 238, 245, .5); display: grid; place-items: center; z-index: 40; }
#busy[hidden] { display: none; }
#busy { align-content: center; gap: 14px; }
#busyMsg { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; font-size: 15px; color: var(--ink-2); box-shadow: var(--shadow); max-width: 90vw; text-align: center; }
#busyMsg:empty { display: none; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { color: var(--muted); padding: 40px 0; }

@media (max-width: 1380px) {
  .top { grid-template-columns: 1fr auto; }
  .pillnav { margin-top: 4px; grid-column: 1 / -1; grid-row: 2; justify-self: center; }
}
@media (max-width: 1100px) {
  .pillnav { grid-column: 1 / -1; grid-row: 2; justify-self: stretch; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel { grid-template-columns: minmax(0, 1fr); }
  .plist { max-height: 300px; }
}
/* タブバー・メニュー（PCでは非表示） */
#tabbar, #moreSheet { display: none; }

/* ───────── スマホ ───────── */
@media (max-width: 720px) {

/* 確認 */
.ez-confirm { background: var(--ez-card); border-radius: 28px; padding: 6px 20px; box-shadow: 0 1px 0 var(--ez-line), 0 18px 30px -24px rgba(30, 42, 90, .6); }

.ez-cta .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.ez-btn { flex: 1; min-height: 66px; border-radius: 999px; font-size: 21px !important; font-weight: 700; color: #fff !important; display: flex; align-items: center; justify-content: center; gap: 8px;

 ' + nfkc_(r[p.memoCol]);\n    var amount = null, dir = null;\n    if (p.amountMode === 'split') {\n      var o = parseAmount(r[p.outCol]), n = parseAmount(r[p.inCol]);\n      if (o) { amount = Math.abs(o); dir = o > 0 ? 'out' : 'in'; }\n      else if (n) { amount = Math.abs(n); dir = n > 0 ? 'in' : 'out'; }\n    } else {\n      var a = parseAmount(r[p.amountCol]);\n      if (a) {\n        if (p.sign === 'inflowPositive') a = -a;\n        dir = a > 0 ? 'out' : 'in';\n        amount = Math.abs(a);\n      }\n    }\n    if (!date || !amount) {\n      skipped.push({ row: i + 1, reason: !date ? '日付を読めません' : '金額が0または空です', text: r.join(',').slice(0, 80) });\n      continue;\n    }\n    items.push({ date: date, desc: desc, amount: amount, direction: dir });\n  }\n  // 同日・同額・同摘要の取引が複数あっても区別できるよう、出現順の番号を付ける\n  var seen = {};\n  items.forEach(function (it) {\n    var k = [it.date, it.direction, it.amount, it.desc].join('|');\n    seen[k] = (seen[k] || 0) + 1;\n    it.key = k + '|' + seen[k];\n  });\n  return { items: items, skipped: skipped };\n}\n\n/** ルール照合。pattern は部分一致（大文字小文字・全半角を無視）、/.../ なら正規表現 */\nfunction matchRule(desc, direction, rules) {\n  var d = nfkc_(desc).toLowerCase();\n  for (var i = 0; i < rules.length; i++) {\n    var r = rules[i];\n    if (r.enabled === false || r.enabled === 'FALSE') continue;\n    if (r.direction && r.direction !== 'any' && r.direction !== direction) continue;\n    var p = String(r.pattern || '');\n    if (!p) continue;\n    var hit = false;\n    if (p.length > 2 && p[0] === '/' && p[p.length - 1] === '/') {\n      try { hit = new RegExp(p.slice(1, -1), 'i').test(nfkc_(desc)); } catch (e) { hit = false; }\n    } else {\n      hit = d.indexOf(nfkc_(p).toLowerCase()) >= 0;\n    }\n    if (hit) return r;\n  }\n  return null;\n}\n\n/**\n * 2科目の仕訳を作る。ratio(事業割合%) が 100 未満で借方が費用・原価・資産なら、\n * 私用分を事業主貸に振り分けて3行にする。\n */\nfunction buildEntryLines(f, accMap) {\n  var amount = parseAmount(f.amount);\n  var ratio = f.ratio === '' || f.ratio == null ? r map = {}, order = [];\n  lines.forEach(function (l) {\n    if (!map[l.entry_id]) {\n      map[l.entry_id] = { entry_id: l.entry_id, date: l.date, memo: l.memo, partner: l.partner, source: l.source,\n        source_hash: l.source_hash, voucher_url: l.voucher_url, reversal_of: l.reversal_of, created_at: l.created_at, lines: [] };\n      order.push(l.entry_id);\n    }\n    map[l.entry_id].lines.push({ account: l.account, debit: Number(l.debit) || 0, credit: Number(l.credit) || 0 });\n  });\n  var reversed = {};\n  order.forEach(function (id) { if (map[id].reversal_of) reversed[map[id].reversal_of] = id; });\n  return order.map(function (id) {\n    var e = map[id];\n    e.reversed_by = reversed[id] || '';\n    return e;\n  });\n}\n\nfunction inYear_(date, year) { return String(date).slice(0, 4) === String(year); }\n\n/** 科目別の借方・貸方合計 */\nfunction sumByAccount_(lines, pred) {\n  var t = {};\n  lines.forEach(function (l) {\n    if (pred && !pred(l)) return;\n    var a = t[l.account] || (t[l.account] = { debit: 0, credit: 0 });\n    a.debit += Number(l.debit) || 0;\n    a.credit += Number(l.credit) || 0;\n  });\n  return t;\n}\n\n/** 区分に応じた残高（正の値が通常） */\nfunction balanceOf_(sum, type) {\n  if (!sum) return 0;\n  return isDebitNormal_(type) ? sum.debit - sum.credit : sum.credit - sum.debit;\n}\n\n/** 決算書・試算表・月別集計をまとめて作る */\nfunction buildStatements(lines, accounts, year, deductionCap) {\n  var yl = lines.filter(function (l) { return inYear_(l.date, year); });\n  var all = sumByAccount_(yl);\n  var opening = sumByAccount_(yl, function (l) { return l.source === 'opening'; });\n\n  var trial = [], revenue = [], cogs = [], expenses = [], assets = [], liabs = [];\n  var tRev = 0, tCogs = 0, tExp = 0;\n  accounts.forEach(function (a) {\n    var s = all[a.code];\n    var bal = balanceOf_(s, a.type);\n    if (s) trial.push({ code: a.code, name: a.name, type: a.type, debit: s.debit, credit: s.credit, balance: bal });\n    var row = { code: a.code, name: a.name, amount: bal };\n    if (a.type === '収益') { revenue.push(row); tRev += bal; }\n    else if (a.type === '原価') { cogs.push(row); tCogs += bal; }\n    else if (a.type === '費用') { expenses.push(row); tExp += bal; }\n    else {\n      var r2 = { code: a.code, name: a.name, opening: balanceOf_(opening[a.code], a.type), closing: bal };\n      if (a.type === '資産') assets.push(r2); else liabs.push(r2);\n    }\n  });\n  var gross = tRev - tCogs;\n  var income = gross - tExp;\n  var cap = Number(deductionCap || 0);\n  var deduction = Math.max(0, Math.min(cap, income));\n\n  var sumCol = function (arr, k) { return arr.reduce(function (s, r) { return s + r[k]; }, 0); };\n  var bs = {\n    assets: assets, liabilities: liabs,\n    totalAssets: { opening: sumCol(assets, 'opening'), closing: sumCol(assets, 'closing') },\n    totalLiabilities: { opening: sumCol(liabs, 'opening'), closing: sumCol(liabs, 'closing') + income },\n    income: income\n  };\n  bs.balanced = bs.totalAssets.closing === bs.totalLiabilities.closing && bs.totalAssets.opening === bs.totalLiabilities.opening;\n\n  // 月別（売上・雑収入・仕入・経費）\n  var months = [];\n  for (var m = 1; m <= 12; m++) months.push({ month: m, sales: 0, misc: 0, purchase: 0, expense: 0 });\n  var typeOf = {};\n  accounts.forEach(function (a) { typeOf[a.code] = a.type; });\n  yl.forEach(function (l) {\n    if (l.source === 'opening') return;\n    var mm = months[Number(String(l.date).slice(5, 7)) - 1];\n    if (!mm) return;\n    var t = typeOf[l.account];\n    var cr = (Number(l.credit) || 0) - (Number(l.debit) || 0);\n    if (l.account === '401') mm.sales += cr;\n    else if (t === '収益') mm.misc += cr;\n    else if (l.account === ACC_PURCHASE) mm.purchase -= cr;\n    else if (t === '費用') mm.expense -= cr;\n  });\n\n  var dr = 0, crt = 0;\n  trial.forEach(function (t) { dr += t.debit; crt += t.credit; });\n  return {\n    year: Number(year),\n    pl: { revenue: revenue, cogs: cogs, expenses: expenses, totalRevenue: tRev, totalCogs: tCogs, gross: gross,\n      totalExpenses: tExp, income: income, deductionCap: cap, deduction: deduction, incomeAfter: income - deduction },\n    bs: bs,\n    trial: { rows: trial, debit: dr, credit: crt },\n    monthly: months\n  };\n}\n\n/** 総勘定元帳（相手科目・残高つき） */\nfunction buildLedger(lines, accounts, year, code) {\n  var acc = null, names = {};\n  accounts.forEach(function (a) { names[a.code] = a.name; if (a.code === code) acc = a; });\n  if (!acc) throw new Error('科目が見つかりません');\n  var yl = lines.filter(function (l) { return inYear_(l.date, year); });\n  var byEntry = {};\n  yl.forEach(function (l) { (byEntry[l.entry_id] = byEntry[l.entry_id] || []).push(l); });\n  var rows = yl.filter(function (l) { return l.account === code; })\n    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.entry_id < b.entry_id ? -1 : 1); });\n  var bal = 0, dSum = 0, cSum = 0;\n  var out = rows.map(function (l) {\n    var others = byEntry[l.entry_id].filter(function (o) { return o.account !== code; })\n      .map(function (o) { return o.account; })\n      .filter(function (v, i, arr) { return arr.indexOf(v) === i; });\n    var d = Number(l.debit) || 0, c = Number(l.credit) || 0;\n    dSum += d; cSum += c;\n    bal += isDebitNormal_(acc.type) ? d - c : c - d;\n    return { date: l.date, entry_id: l.entry_id, counter: others.length === 1 ? names[others[0]] : '諸口',\n      memo: l.memo, debit: d, credit: c, balance: bal, opening: l.source === 'opening' };\n  });\n  return { account: acc, rows: out, debit: dSum, credit: cSum, balance: bal };\n}\n\n/**\n * 翌年の期首残高を計算する。\n * 資産・負債は期末残高を引き継ぎ、事業主貸・事業主借は0に戻し、\n * 元入金 = 資産合計 − 負債合計 とする。\n */\nfunction computeCarryForward(lines, accounts, year) {\n  var all = sumByAccount_(lines.filter(function (l) { return inYear_(l.date, year); }));\n  var balances = {}, ta = 0, tl = 0;\n  accounts.forEach(function (a) {\n    if (a.code === ACC_PRIVATE_OUT || a.type === '資本') return;\n    if (a.type !== '資産' && a.type !== '負債') return;\n    var b = balanceOf_(all[a.code], e(0, 60) });\n      continue;\n    }\n    if (!(gross > 0) && has(p.payoutCol)) {\n      var amt = parseAmount(r[p.payoutCol]);\n      if (date && amt > 0) {\n        payouts.push({ date: date, desc: desc, amount: amt, charge: !!(p.chargeKeyword && desc.indexOf(nfkc_(p.chargeKeyword)) >= 0) });\n        continue;\n      }\n    }\n    var fee = opt(r, p.feeCol) + opt(r, p.fee2Col), ship = opt(r, p.shipCol);\n    var why = !date ? '日付を読めません' : !(gross > 0) ? '販売価格が0または空です' : gross - fee - ship <= 0 ? '手数料・送料が販売価格以上です' : '';\n    if (why) { skipped.push({ row: i + 1, reason: why, text: r.join(',').slice(0, 80) }); continue; }\n    var id = has(p.idCol) ? nfkc_(r[p.idCol]) : '';\n    items.push({ date: date, desc: desc, gross: gross, fee: fee, ship: ship, net: gross - fee - ship,\n      id: id && id !== '-' ? id : '', status: has(p.statusCol) ? nfkc_(r[p.statusCol]) : '' });\n  }\n  var seen = {};\n  items.forEach(function (it) {\n    if (it.id) { it.key = 'sale-id|' + it.id; return; }\n    var k = ['sale', it.date, it.gross, it.fee, it.ship, it.desc].join('|');\n    seen[k] = (seen[k] || 0) + 1;\n    it.key = k + '|' + seen[k];\n  });\n  payouts.forEach(function (it) {\n    var k = ['payout', it.date, it.amount, it.desc].join('|');\n    seen[k] = (seen[k] || 0) + 1;\n    it.key = k + '|' + seen[k];\n  });\n  return { items: items, payouts: payouts, skipped: skipped };\n}\n\n/** 入金1件 → 仕訳（入金先 ／ 売掛金）。チャージは別の科目（既定は事業主貸）へ */\nfunction payoutLines(it, counter, payoutAccount, chargeAccount) {\n  var to = String(it.charge ? (chargeAccount || ACC_PRIVATE_OUT) : (payoutAccount || '102'));\n  return [{ account: to, debit: it.amount, credit: 0 }, { account: String(counter), debit: 0, credit: it.amount }];\n}\n\n/** CSV の見出しから既知の販売サイトを判定して列設定を返す（なければ null） */\nfunction detectSalesFormat(header) {\n  var h = (header || []).map(nfkc_);\n  var at = function (name) { return h.indexOf(name); };\n  if (at('取扱内容') >= 0 && at('受取金額') >= 0 && at('決済金額') >= 0) {\n    return { name: 'ヤフオク', headerRows: 1, descCol: at('取扱内容'), idCol: at('商品ID'), dateCol: at('取扱日'), statusCol: at('状態'),\n      grossCol: at('決済金額'), feeCol: at('落札システム利用料'), fee2Col: at('販売手数料'), shipCol: at('送料'), payoutCol: at('受取金額'),\n      chargeKeyword: 'チャージ', skipStatus: 'キャンセル', counter: '110', payoutAccount: '102', chargeAccount: '190' };\n  }\n  var start = function (name) { for (var i = 0; i < h.length; i++) if (h[i].indexOf(name) === 0) return i; return -1; };\n  if (start('商品タイトル') >= 0 && start('商品価格') >= 0 && start('販売利益') >= 0) {\n    return { name: 'メルカリ', headerRows: 1, descCol: start('商品タイトル'), idCol: '', dateCol: start('購入完了日'), statusCol: '',\n      grossCol: start('商品価格'), feeCol: start('販売手数料'), fee2Col: start('他費用'), shipCol: start('送料'), payoutCol: '',\n      chargeKeyword: '', skipStatus: '', counter: '110', payoutAccount: '102', chargeAccount: '190' };\n  }\n  return null;\n}\n\n/** 販売1件 → 複合仕訳（入金予定額 / 手数料 / 送料 ← 売上） */\nfunction saleLines(it, counter) {\n  var lines = [{ account: String(counter), debit: it.net, credit: 0 }];\n  if (it.fee) lines.push({ account: ACC_FEE, debit: it.fee, credit: 0 });\n  if (it.ship) lines.push({ account: ACC_SHIP, debit: it.ship, credit: 0 });\n  lines.push({ account: ACC_SALES, debit: 0, credit: it.gross });\n  return lines;\n}\n\n/** 棚卸表の金額（数量×単価、円未満四捨五入）と区分別の合計 */\nfunction inventorySummary(rows) {\n  var byCat = {}, total = 0;\n  rows.forEach(function (r) {\n    var amt = Math.round((Number(r.qty) || 0) * (Number(r.unit_cost) || 0));\n    r.amount = amt;\n    byCat[r.category || 'その他'] = (byCat[r.category || 'その他'] || 0) + amt;\n    total += amt;\n  });\n  return { rows: rows, byCategory: byCat, total: total };\n}\n\n/**\n * 年末の在庫振替仕訳（12/31付）\n *   期首商品棚卸高 / 商品   … 期首在庫を原価へ\n *   商品 / 期末商品棚卸高   … 期末在庫を資産へ\n */\nfunction inventoryClosingLines(openingStock, closingStock) {\n  var lines = [];\n  if (openingStock > 0) {\n    lines.push({ account: ACC_STOCK_OPEN, debit: openingStock, credit: 0 });\n    lines.push({ account: ACC_STOCK, debit: 0, credit: openingStock });\n  }\n  if (closingStock > 0) {\n    lines.push({ account: ACC_STOCK, debit: closingStock, credit: 0 });\n    lines.push({ account: ACC_STOCK_CLOSE, debit: 0, credit: closingStock });\n  }\n  return lines;\n}\n\n/**\n * 期首在庫の逆算\n *   期首在庫 ＝ 棚卸日の在庫 ＋ 期首〜棚卸日に売れた分の原価 − 同期間の仕入\n * 売れた分の原価は、手入力（soldCost）か、売上 × 原価率（costRatio%）。\n */\nfunction reconstructOpeningStock(lines, year, countDate, countTotal, opt) {\n  var from = year + '-01-01';\n  var inRange = function (l) { return l.date >= from && l.date <= countDate && l.source !== 'opening' && l.source !== 'inventory'; };\n  var purchases = 0, sales = 0;\n  lines.forEach(function (l) {\n    if (!inRange(l)) return;\n    if (l.account === ACC_PURCHASE) purchases += (Number(l.debit) || 0) - (Number(l.credit) || 0);\n    if (l.account === ACC_SALES) sales += (Number(l.credit) || 0) - (Number(l.debit) || 0);\n  });\n  var soldCost = opt.soldCost !== '' && opt.soldCost != null && !isNaN(Number(opt.soldCost))\n    ? Number(opt.soldCost) : Math.round(sales * (Number(opt.costRatio) || 0) / 100);\n  return { from: from, to: countDate, count: countTotal, purchases: purchases, sales: sales, soldCost: soldCost,\n    estimate: countTotal + soldCost - purchases };\n}\n\n/* ───────── 石の仕入明細と単価 ───────── */\n\n/** 品目キー（種類＋サイズ。全角半角・大小・空白の違いを吸収） */\nfunction stoneKey(stone, size) {\n  return nfkc_(stone).toLowerCase().replace(/\\s/g, '') + '|' + nfkc_(size).toLowerCase().replace(/\\s/g, '');\n}\n\n/** \"3×48\" \"3*48\" \"144\" → 数量 */\nfunction parseQty(v) {\n  var s = nfkc_(v).replace(/,/g, '').replace(/[x×]/gi, '*');\n  if (!s) return 0;\n  if (!/^[\\d.]+(\\*[\\d.]+)*$/.test(s)) return NaN;\n  return s.split('*').reduce(function (p, x) { return p * parseFloat(x); }, 1);\n}\n\n/** 仕入時の送料などを金額比で各行に配分（端数は最大剰余法で合計を一致させる） */\nfunction allocateExtra(amounts, extra) {\n  var total = amounts.reduce(function (s, a) { return s + a; }, 0);\n  if (!extra || !total) return amounts.map(function () { return 0; });\n  var raw = amounts.map(function (a) { return extra * a / total; });\n  var base = raw.map(Math.floor);\n  var rest = extra - base.reduce(function (s, a) { return s + a; }, 0);\n  raw.map(function (r, i) { return { i: i, f: r - base[i] }; })\n    .sort(function (a, b) { return b.f - a.f; })\n    .slice(0, rest).forEach(function (x) { base[x.i]++; });\n  return base;\n}\n\n/**\n * 品目ごとの単価（1粒あたり）\n *   last … 最終仕入原価法：asOf 以前で最も新しい仕入の単価（仕入がなければ持込・期首の単価）\n *   avg  … 平均単価：asOf 以前の全明細の合計金額 ÷ 合計数量\n */\nfunction computeUnitCosts(lots, asOf) {\n  var map = {};\n  lots.filter(function (l) { return !asOf || String(l.date) <= asOf; })\n    .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })\n    .forEach(function (l) {\n      var qty = Number(l.qty) || 0, amt = Number(l.amount) || 0;\n      if (!qty) return;\n      var k = stoneKey(l.stone, l.size);\n      var m = map[k] || (map[k] = { key: k, stone: nfkc_(l.stone), size: nfkc_(l.size), qty: 0, amount: 0, lots: 0 });\n      m.qty += qty; m.amount += amt; m.lots++;\n      var isBuy = l.kind === '仕入';\n      if (isBuy || !m.lastIsBuy) { m.last = amt / qty; m.lastDate = String(l.date); m.lastKind = l.kind; m.lastIsBuy = isBuy; }\n    });\n  return Object.keys(map).sort().map(function (k) {\n    var m = map[k];\n    m.avg = m.amount / m.qty;\n    m.last = Math.round(m.last * 100) / 100;\n    m.avg = Math.round(m.avg * 100) / 100;\n    delete m.lastIsBuy;\n    return m;\n  });\n}\n\n/* ───────── 天然石ショップ：商品名の判定と販売の集計 ───────── */\n\n/** 標準の石の名前（長い名前から順に照合するので「ヒマラヤ水晶」が「水晶」より優先される） */\nvar STONE_NAMES = ['翡翠', 'ラピスラズリ', 'ソーダライト', 'ローズクォーツ', 'ヒマラヤ水晶', '水晶', 'オーシャンジャスパー', 'レッドジャスパー',\n  'ジャスパー', 'タイガーアイ', 'ホークアイ', 'グリーンアベンチュリン', 'アベンチュリン', 'アメジスト', 'スノーフレークオブシディアン',\n  'オブシディアン', 'ヘマタイト', '龍紋メノウ', '黄色縞瑪瑙', '赤瑪瑙', 'メノウ', '瑪瑙', 'ハウライト', 'ブルーレースアゲート', 'アゲート',\n  'アラゴナイト', 'ニュージェイド', 'ムーンストーン', 'ラブラドライト', 'シトリン', 'カーネリアン', 'ガーネット', 'アクアマリン', 'ターコイズ',\n  'マラカイト', 'ルチルクォーツ', 'スモーキークォーツ', 'フローライト', 'ブラックオニキス', 'オニキス', 'モリオン', 'インカローズ',\n  'ロードクロサイト', 'ラリマー', 'チャロアイト', 'スギライト', 'ユナカイト', 'プレナイト', '天眼石', '琥珀', 'アマゾナイト', 'クンツァイト',\n  'ペリドット', 'セラフィナイト', 'アンバー', 'ルビー', 'サファイア', 'エメラルド', 'パール', '真珠', 'ブラックトルマリン', 'トルマリン'];\n/** 標準の別名 → 正式名 */\nvar STONE_ALIASES = { 'ヒスイ': '翡翠', 'ひすい': '翡翠', 'クリスタル': '水晶', 'ガネーシュヒマール': 'ヒマラヤ水晶', 'アンバー': '琥珀', '真珠': 'パール', 'ラピス': 'ラピスラズリ' };\n/** 形（長い名前から照合） */\nvar SHAPES = [['ダブルポイント', 'ダブルポイント'], ['ポイント', 'ポイント'], ['勾玉', '勾玉'], ['丸玉', '丸玉'], ['さざれ', 'さざれ'],\n  ['原石', '原石'], ['タンブル', 'タンブル'], ['龍彫り', '彫刻'], ['彫り', '彫刻'], ['ブレスレット', 'ブレスレット'], ['ピアス', 'ピアス'], ['ペンダント', 'ペンダント'], ['剣', '剣']];\n\n/**\n * 「別名=正式名」「石の名前」を1行ずつ書いた辞書テキストを読み込む\n * 例： クリスタル=水晶 ／ ガネーシュ=ヒマラヤ水晶 ／ スーパーセブン\n */\nfunction buildStoneDict(text) {\n  var names = STONE_NAMES.slice(), aliases = {};\n  Object.keys(STONE_ALIASES).forEach(function (k) { aliases[k] = STONE_ALIASES[k]; });\n  String(text || '').split(/\\r?\\n/).forEach(function (line) {\n    var l = nfkc_(line);\n    if (!l || l[0] === '#') return;\n    var m = l.split('=');\n    if (m.length >= 2 && m[0].trim() && m[1].trim()) { aliases[m[0].trim()] = m[1].trim(); names.push(m[1].trim()); }\n    else names.push(l);\n  });\n  var keys = names.concat(Object.keys(aliases)).filter(function (v, i, a) { return v && a.indexOf(v) === i; })\n    .sort(function (a, b) { return b.length - a.length; });\n  return { keys: keys, aliases: aliases };\n}\n\n/** 商品名 → {stone, shape}。辞書にない石は【天然石】の直後の言葉を使う */\nfunction parseStoneTitle(title, dict) {\n  dict = dict || buildStoneDict('');\n  var t = nfkc_(title);\n  var stone = '';\n  for (var i = 0; i < dict.keys.length; i++) {\n    if (t.indexOf(nfkc_(dict.keys[i])) >= 0) { stone = dict.aliases[dict.keys[i]] || dict.keys[i]; break; }\n  }\n  if (!stone && /天然石/.test(t)) {\n    var body = t.replace(/^.*?【天然石】|^.*?\\[天然石\\]/, '');\n    var tok = body.split(/[☆★◇◆●○■□◎※\\s・|｜/]+/).filter(function (x) { return x && !/^(特大|希少|天然石|本革ネックレス|ネックレス|まとめ売り)$/.test(x); })[0];\n    stone = tok && tok.length <= 15 ? tok : '';\n  }\n  stone = stone || 'その他';\n  var shape = '';\n  for (var j = 0; j < SHAPES.length; j++) if (t.indexOf(SHAPES[j][0]) >= 0) { shape = SHAPES[j][1]; break; }\n  if (!shape && /\\d+\\s*mm玉/.test(t)) shape = 'ビーズ';\n  return { stone: stone, shape: shape || 'その他' };\n}\n\n/**\n * 販売明細の集計\n * rows: [{date, site, title, stone, shape, price, fee, ship, net}]\n */\nfunction salesStats(rows) {\n  var sum = function (arr, k) { return arr.reduce(function (s, x) { return s + (Number(x[k]) || 0); }, 0); };\n  var group = function (key) {\n    var m = {};\n    rows.forEach(function (r) { (m[r[key] || 'その他'] = m[r[key] || 'その他'] || []).push(r); });\n    return Object.keys(m).map(function (k) {\n      var a = m[k], price = sum(a, 'price');\n      return { name: k, count: a.length, price: price, fee: sum(a, 'fee'), ship: sum(a, 'ship'), net: sum(a, 'net'), avg: Math.round(price / a.length), rows: a };\n    }).sort(function (a, b) { return b.price - a.price || b.count - a.count; });\n  };\n  var total = { count: rows.length, price: sum(rows, 'price'), fee: sum(rows, 'fee'), ship: sum(rows, 'ship'), net: sum(rows, 'net') };\n  total.avg = rows.length ? Math.round(total.price / rows.length) : 0;\n  var sites = group('site').map(function (g) { return g.name; });\n  var months = function (a) {\n    var m = [];\n    for (var i = 0; i < 12; i++) m.push({ count: 0, price: 0, bySite: {} });\n    a.forEach(function (r) {\n      var x = m[Number(String(r.date).slice(5, 7)) - 1];\n      if (!x) return;\n      x.count++; x.price += Number(r.price) || 0; x.bySite[r.site] = (x.bySite[r.site] || 0) + (Number(r.price) || 0);\n    });\n    return m;\n  };\n  var byStone = group('stone').map(function (g) {\n    var bySite = {}, byShape = {};\n    g.rows.forEach(function (r) { bySite[r.site] = (bySite[r.site] || 0) + 1; byShape[r.shape] = (byShape[r.shape] || 0) + 1; });\n    var recent = g.rows.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 6)\n      .map(function (r) { return { date: r.date, site: r.site, title: r.title, price: r.price, net: r.net, shape: r.shape }; });\n    var last = recent[0] ? recent[0].date : '';\n    return { name: g.name, count: g.count, price: g.price, fee: g.fee, ship: g.ship, net: g.net, avg: g.avg, share: total.price ? g.price / total.price : 0,\n      months: months(g.rows).map(function (x) { return x.price; }), bySite: bySite, byShape: byShape, recent: recent, last: last };\n  });\n  var strip = function (arr) { return arr.map(function (g) { delete g.rows; return g; }); };\n  return { total: total, sites: sites, byStone: byStone, bySite: strip(group('site')), byShape: strip(group('shape')), months: months(rows) };\n}\n\n/** 在庫の目安：仕入（持込・期首を含む）の数量 − 販売数（石の種類×形） */\nfunction stockEstimate(lots, sales) {\n  var m = {};\n  var key = function (stone, shape) { return stoneKey(stone, shape); };\n  lots.forEach(function (l) {\n    var k = key(l.stone, l.size);\n    var x = m[k] || (m[k] = { stone: nfkc_(l.stone), shape: nfkc_(l.size), bought: 0, sold: 0, amount: 0 });\n    x.bought += Number(l.qty) || 0; x.amount += Number(l.amount) || 0;\n  });\n  sales.forEach(function (s) {\n    var k = key(s.stone, s.shape);\n    var x = m[k] || (m[k] = { stone: s.stone, shape: s.shape, bought: 0, sold: 0, amount: 0 });\n    x.sold += 1;\n  });\n  return Object.keys(m).map(function (k) {\n    var x = m[k];\n    x.left = x.bought - x.sold;\n    x.unit = x.bought ? Math.round(x.amount / x.bought) : 0;\n    return x;\n  }).sort(function (a, b) { return a.stone < b.stone ? -1 : a.stone > b.stone ? 1 : (a.shape < b.shape ? -1 : 1); });\n}\n\n/** Node でのテスト用 */\nif (typeof module !== 'undefined') {\n  module.exports = { DEFAULT_ACCOUNTS: DEFAULT_ACCOUNTS, parseAmount: parseAmount, normalizeDate: normalizeDate,\n    parseCsv: parseCsv, csvToItems: csvToItems, matchRule: matchRule, buildEntryLines: buildEntryLines,\n    itemToForm: itemToForm, validateLines: validateLines, groupEntries: groupEntries, buildStatements: buildStatements,\n    buildLedger: buildLedger, computeCarryForward: computeCarryForward, openingLines: openingLines,\n    extractJsonArray: extractJsonArray, salesToItems: salesToItems, saleLines: saleLines,\n    inventorySummary: inventorySummary, payoutLines: payoutLines, detectSalesFormat: detectSalesFormat, htmlTableToRows: htmlTableToRows, textToRows: textToRows, buildStoneDict: buildStoneDict, parseStoneTitle: parseStoneTitle, salesStats: salesStats, stockEstimate: stockEstimate, inventoryClosingLines: inventoryClosingLines,\n    reconstructOpeningStock: reconstructOpeningStock, stoneKey: stoneKey, parseQty: parseQty,\n    allocateExtra: allocateExtra, computeUnitCosts: computeUnitCosts };\n}\n\n;\n/**\n * Store.gs — スプレッドシートへの保存・読込\n * 列の位置は SCHEMA の順序で固定。見出し行は人が読むための日本語。\n */\n\nvar SCHEMA = {\n  journal: {\n    sheet: '仕訳帳',\n    cols: [['entry_id', '仕訳ID'], ['line', '行'], ['date', '日付'], ['account', '科目コード'], ['account_name', '科目名'],\n      ['debit', '借方金額'], ['credit', '貸方金額'], ['memo', '摘要'], ['partner', '取引先'], ['source', '入力元'],\n      ['source_hash', '取込キー'], ['voucher_url', '証憑'], ['reversal_of', '取消対象'], ['created_at', '登録日時']],\n    text: ['entry_id', 'date', 'account', 'reversal_of']\n  },\n  inbox: {\n    sheet: '要確認',\n    cols: [['id', 'ID'], ['date', '日付'], ['direction', '入出金'], ['amount', '金額'], ['desc', '摘要'], ['source', '取込元'],\n      ['counter', '相手科目'], ['source_hash', '取込キー'], ['suggested', '推定科目'], ['ratio', '事業割合'],\n      ['status', '状態'], ['entry_id', '仕訳ID'], ['note', 'メモ'], ['imported_at', '取込日時']],\n    text: ['id', 'date', 'counter', 'suggested', 'entry_id']\n  },\n  accounts: {\n    sheet: '勘定科目',\n    cols: [['code', 'コード'], ['name', '科目名'], ['type', '区分'], ['active', '使用']],\n    text: ['code']\n  },\n  rules: {\n    sheet: '仕訳ルール',\n    cols: [['id', 'ID'], ['pattern', '摘要に含む文字'], ['direction', '入出金'], ['account', '科目コード'],\n      ['ratio', '事業割合'], ['enabled', '有効'], ['note', 'メモ']],\n    text: ['id', 'account']\n  },\n  presets: {\n    sheet: '取込設定',\n    cols: [['name', '名前'], ['json', '設定(JSON)']],\n    text: []\n  },\n  inventory: {\n    sheet: '棚卸表',\n    cols: [['count_date', '棚卸日'], ['category', '区分'], ['item', '品目'], ['spec', 'サイズ・規格'], ['unit', '単位'],\n      ['qty', '数量'], ['unit_cost', '単価'], ['amount', '金額'], ['note', '単価の根拠・メモ']],\n    text: ['count_date']\n  },\n  lots: {\n    sheet: '石の仕入明細',\n    cols: [['id', 'ID'], ['group', '仕入番号'], ['date', '日付'], ['kind', '区分'], ['stone', '石の種類'], ['size', 'サイズ'],\n      ['qty', '数量（粒）'], ['amount', '金額（送料等込み）'], ['entry_id', '仕訳ID'], ['note', 'メモ']],\n    text: ['id', 'group', 'date', 'size', 'entry_id']\n  },\n  sales: {\n    sheet: '販売明細',\n    cols: [['hash', '取込キー'], ['date', '日付'], ['site', '販売先'], ['item_id', '商品ID'], ['title', '商品名'], ['stone', '石の種類'],\n      ['shape', '形'], ['price', '販売価格'], ['fee', '手数料'], ['ship', '送料'], ['net', '受取額'], ['status', '状態'], ['entry_id', '仕訳ID'], ['locked', '手で修正']],\n    text: ['hash', 'date', 'item_id', 'entry_id']\n  },\n  settings: {\n    sheet: '設定',\n    cols: [['key', 'キー'], ['value', '値'], ['note', '説明']],\n    text: ['value']\n  }\n};\n\nvar _ss = null;\nfunction ss_() {\n  if (_ss) return _ss;\n  _ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (!_ss) {\n    var id = PropertiesService.getScriptProperties().getProperty('SPREADSHEET_ID');\n    if (!id) throw new Error('スプレッドシートが見つかりません。スプレッドシートのメニューから一度「初期設定」を実行してください。');\n    _ss = SpreadsheetApp.openById(id);\n  }\n  return _ss;\n}\n\nvar _tz = null, _sheets = {};\nfunction tz_() { return _tz || (_tz = ss_().getSpreadsheetTimeZone() || 'Asia/Tokyo'); }\nfunction now_() { return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HH:mm:ss'); }\n\n/** シートを取得（なければ見出し付きで作成） */\nfunction sheet_(kind) {\n  if (_sheets[kind]) return _sheets[kind];\n  var def = SCHEMA[kind];\n  var sh = ss_().getSheetByName(def.sheet);\n  if (!sh) {\n    sh = ss_().insertSheet(def.sheet);\n    sh.getRange(1, 1, 1, def.cols.length).setValues([def.cols.map(function (c) { return c[1]; })]);\n    sh.setFrozenRows(1);\n    def.text.forEach(function (k) {\n      var idx = colIndex_(kind, k) + 1;\n      sh.getRange(1, idx, sh.getMaxRows(), 1).setNumberFormat('@');\n    });\n  }\n  _sheets[kind] = sh;\n  return sh;\n}\n\nfunction colIndex_(kind, key) {\n  var cols = SCHEMA[kind].cols;\n  for (var i = 0; i < cols.length; i++) if (cols[i][0] === key) return i;\n  throw new Error('unknown column ' + kind + '.' + key);\n}\n\n/** 全行をオブジェクトで読む（_row にシート上の行番号） */\nfunction readAll_(kind) {\n  var def = SCHEMA[kind];\n  var sh = sheet_(kind);\n  var last = sh.getLastRow();\n  if (last < 2) return [];\n  var values = sh.getRange(2, 1, last - 1, def.cols.length).getValues();\n  var tz = tz_();\n  var out = [];\n  for (var r = 0; r < values.length; r++) {\n    var row = values[r];\n    if (row.every(function (v) { return v === '' || v == null; })) continue;\n    var o = { _row: r + 2 };\n    for (var c = 0; c < def.cols.length; c++) {\n      var v = row[c];\n      if (Object.prototype.toString.call(v) === '[object Date]') {\n        v = /date$/.test(def.cols[c][0]) ? Utilities.formatDate(v, tz, 'yyyy-MM-dd') : Utilities.formatDate(v, tz, 'yyyy-MM-dd HH:mm:ss');\n      }\n      o[def.cols[c][0]] = v;\n    }\n    out.push(o);\n  }\n  return out;\n}\n\nfunction toRow_(kind, o) {\n  return SCHEMA[kind].cols.map(function (c) { var v = o[c[0]]; return v == null ? '' : v; });\n}\n\n/** 末尾にまとめて追記 */\nfunction appendAll_(kind, objs) {\n  if (!objs.length) return;\n  var sh = sheet_(kind);\n  var start = sh.getLastRow() + 1;\n  sh.getRange(start, 1, objs.length, SCHEMA[kind].cols.length).setValues(objs.map(function (o) { return toRow_(kind, o); }));\n}\n\n/** _row を持つオブジェクトをその行に書き戻す */\nfunction updateAll_(kind, objs) {\n  if (!objs.length) return;\n  var sh = sheet_(kind), n = SCHEMA[kind].cols.length;\n  if (objs.length <= 2) {\n    objs.forEach(function (o) { sh.getRange(o._row, 1, 1, n).setValues([toRow_(kind, o)]); });\n    return;\n  }\n  // まとめて1回で書き戻す（行ごとに書くと遅いため）\n  var rows = objs.map(function (o) { return o._row; });\n  var top = Math.min.apply(null, rows), bottom = Math.max.apply(null, rows);\n  var block = sh.getRange(top, 1, bottom - top + 1, n).getValues();\n  objs.forEach(function (o) { block[o._row - top] = toRow_(kind, o); });\n  sh.getRange(top, 1, block.length, n).setValues(block);\n}\n\n/** 行を削除（下から） */\nfunction deleteRows_(kind, rows) {\n  var sh = sheet_(kind);\n  rows.slice().sort(function (a, b) { return b - a; }).forEach(function (r) { sh.deleteRow(r); });\n}\n\n/** 残す行だけで書き直す（大量削除を1回の書き込みで行う） */\nfunction keepOnly_(kind, keep) {\n  var sh = sheet_(kind), n = SCHEMA[kind].cols.length, last = sh.getLastRow();\n  if (last < 2) return 0;\n  var rows = keep.map(function (o) { return toRow_(kind, o); });\n  var removed = (last - 1) - rows.length;\n  var blank = [];\n  for (var i = 0; i < Math.max(0, removed); i++) blank.push(SCHEMA[kind].cols.map(function () { return ''; }));\n  var all = rows.concat(blank);\n  if (all.length) sh.getRange(2, 1, all.length, n).setValues(all);\n  return removed;\n}\n\n/** 設定 key-value */\nfunction getSettings_() {\n  var o = {};\n  readAll_('settings').forEach(function (r) { o[r.key] = r.value; });\n  return o;\n}\n\nfunction setSetting_(key, value, note) {\n  var rows = readAll_('settings');\n  for (var i = 0; i < rows.length; i++) {\n    if (rows[i].key === key) {\n      rows[i].value = String(value);\n      updateAll_('settings', [rows[i]]);\n      return;\n    }\n  }\n  appendAll_('settings', [{ key: key, value: String(value), note: note || '' }]);\n}\n\nfunction withLock_(fn) {\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try { return fn(); } finally { lock.releaseLock(); }\n}\n\n;\n/**\n * Code.gs — 画面（Index.html）から呼ばれるサーバー側の処理\n * 画面からは api(method, payload) だけを呼びます。末尾が _ の関数は画面から呼べません。\n */\n\nvar APP_TITLE = '青色帳簿';\nvar DEFAULT_AI_MODEL = 'claude-haiku-4-5-20251001';\nvar AI = {\n  gemini: { label: 'Gemini', keyProp: 'GEMINI_API_KEY', model: 'gemini-3.8-flash' },\n  anthropic: { label: 'Claude', keyProp: 'ANTHROPIC_API_KEY', model: DEFAULT_AI_MODEL }\n};\n\nfunction aiProvider_(s) { s = s || getSettings_(); return AI[s.aiProvider] ? s.aiProvider : (PropertiesService.getScriptProperties().getProperty('ANTHROPIC_API_KEY') ? 'anthropic' : 'gemini'); }\nfunction aiModel_(prov, s) { s = s || getSettings_(); return s['aiModel_' + prov] || (prov === 'anthropic' && s.aiModel) || AI[prov].model; }\n\n/** AI に問い合わせてテキストを返す（Gemini / Claude） */\nfunction callAi_(prompt) {\n  var s = getSettings_(), prov = aiProvider_(s);\n  var key = PropertiesService.getScriptProperties().getProperty(AI[prov].keyProp);\n  if (!key) throw new Error('設定画面で ' + AI[prov].label + ' の API キーを登録してください');\n  var model = aiModel_(prov, s), res;\n  if (prov === 'gemini') {\n    res = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {\n      method: 'post', contentType: 'application/json', muteHttpExceptions: true, headers: { 'x-goog-api-key': key },\n      payload: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { responseMimeType: 'application/json' } })\n    });\n  } else {\n    res = UrlFetchApp.fetch('https://api.anthropic.com/v1/messages', {\n      method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01' },\n      payload: JSON.stringify({ model: model, max_tokens: 4000, messages: [{ role: 'user', content: prompt }] })\n    });\n  }\n  if (res.getResponseCode() !== 200) throw new Error(AI[prov].label + ' API エラー (' + res.getResponseCode() + '): ' + res.getContentText().slice(0, 200));\n  var body = JSON.parse(res.getContentText());\n  if (prov === 'gemini') {\n    var c = (body.candidates || [])[0];\n    return c && c.content ? (c.content.parts || []).map(function (x) { return x.text || ''; }).join('') : '';\n  }\n  return (body.content || []).map(function (x) { return x.text || ''; }).join('');\n}\n\n/* ───────── 起動まわり ───────── */\n\nfunction doGet() {\n  return HtmlService.createTemplateFromFile('Index').evaluate()\n    .setTitle(APP_TITLE)\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\nfunction include(name) {\n  return HtmlService.createHtmlOutputFromFile(name).getContent();\n}\n\nfunction onOpen() {\n  SpreadsheetApp.getUi().createMenu(APP_TITLE)\n    .addItem('アプリを開く', 'openApp')\n    .addItem('初期設定（初回のみ）', 'setup')\n    .addToUi();\n}\n\n/** Webアプリとして公開済みなら新しいタブで開く（未公開ならダイアログで開く） */\nfunction openApp() {\n  var url = '';\n  try { url = ScriptApp.getService().getUrl() || ''; } catch (e) { url = ''; }\n  if (url) {\n    var h = HtmlService.createHtmlOutput(\n      '<div style=\"font-family:sans-serif;padding:8px 4px\">' +\n      '<p style=\"margin:0 0 14px\">青色帳簿を新しいタブで開きます。開かない場合は下のボタンを押してください。<\/p>' +\n      '<a href=\"' + url + '\" target=\"_blank\" style=\"display:inline-block;background:#5b4cf0;color:#fff;padding:10px 20px;border-radius:999px;text-decoration:none;font-weight:bold\">青色帳簿を開く<\/a><\/div>' +\n      '<script>window.open(' + JSON.stringify(url) + ', \"_blank\");<\/script>').setWidth(380).setHeight(150);\n    SpreadsheetApp.getUi().showModalDialog(h, APP_TITLE);\n    return;\n  }\n  var html = HtmlService.createTemplateFromFile('Index').evaluate().setWidth(1400).setHeight(900);\n  SpreadsheetApp.getUi().showModelessDialog(html, APP_TITLE);\n}\n\n/** 初期設定（何度実行しても安全） */\nfunction setup() {\n  setup_();\n  try { SpreadsheetApp.getUi().alert('初期設定が完了しました。メニュー「' + APP_TITLE + '」→「アプリを開く」から使えます。'); } catch (e) { /* Webアプリから呼ばれた場合 */ }\n}\n\nfunction setup_() {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (ss) PropertiesService.getScriptProperties().setProperty('SPREADSHEET_ID', ss.getId());\n  Object.keys(SCHEMA).forEach(function (k) { sheet_(k); });\n  // 足りない標準科目だけを追加（既存のデータはそのまま）\n  var have = {};\n  readAll_('accounts').forEach(function (a) { have[String(a.code)] = true; });\n  var missing = DEFAULT_ACCOUNTS.filter(function (a) { return !have[a[0]]; });\n  appendAll_('accounts', missing.map(function (a) { return { code: a[0], name: a[1], type: a[2], active: true }; }));\n  var s = getSettings_();\n  // 物販機能は標準でオン（v3 から。以前の版で自動的にオフになっていた場合も一度だけオンに戻す）\n  if (s.inventory == null || !s.shopDefaultV3) {\n    setSetting_('inventory', true, '物販機能（販売の取込・石の仕入・棚卸）を使う');\n    setSetting_('shopDefaultV3', true, '内部用');\n  }\n  if (!s.year) setSetting_('year', new Date().getFullYear(), '表示する会計年度');\n  if (!s.deduction) setSetting_('deduction', 650000, '青色申告特別控除の上限（650000 / 550000 / 100000）');\n  if (!s.aiModel) setSetting_('aiModel', DEFAULT_AI_MODEL, 'AI推定に使うモデル');\n  var blank = ss_().getSheetByName('シート1') || ss_().getSheetByName('Sheet1');\n  if (blank && blank.getLastRow() === 0 && ss_().getSheets().length > 1) ss_().deleteSheet(blank);\n}\n\n/* ───────── 画面からの唯一の入口 ───────── */\n\nfunction api(method, payload) {\n  var fn = API_[method];\n  if (!fn) throw new Error('不明な操作です: ' + method);\n  var result = fn(payload || {});\n  return JSON.parse(JSON.stringify(result == null ? null : result));\n}\n\n/* ───────── 内部ヘルパー ───────── */\n\nfunction accounts_() { return readAll_('accounts'); }\n\nfunction accMap_(accounts) {\n  var m = {};\n  (accounts || accounts_()).forEach(function (a) { m[String(a.code)] = { code: String(a.code), name: a.name, type: a.type }; });\n  return m;\n}\n\nfunction nextEntryId_(journal) {\n  if (journal._next == null) {\n    var max = 0;\n    journal.forEach(function (l) {\n      var n = parseInt(String(l.entry_id).replace(/\\D/g, ''), 10);\n      if (n > max) max = n;\n    });\n    journal._next = max + 1;\n  }\n  return 'J' + ('00000' + (journal._next++)).slice(-6);\n}\n\n/** 仕訳を1件書き込み、仕訳IDを返す */\n/** buffer を渡すと書き込まずに溜める（まとめて appendAll_ するため） */\nfunction writeEntry_(journal, date, lines, meta, accMap, buffer) {\n  date = normalizeDate(date);\n  validateLines(date, lines, accMap);\n  var id = nextEntryId_(journal);\n  var ts = now_();\n  var rows = lines.map(function (l, i) {\n    var o = {\n      entry_id: id, line: i + 1, date: date, account: l.account, account_name: accMap[l.account].name,\n      debit: l.debit || '', credit: l.credit || '', memo: meta.memo || '', partner: meta.partner || '',\n      source: meta.source || 'manual', source_hash: meta.source_hash || '', voucher_url: meta.voucher_url || '',\n      reversal_of: meta.reversal_of || '', created_at: ts\n    };\n    journal.push(o);\n    return o;\n  });\n  if (buffer) Array.prototype.push.apply(buffer, rows); else appendAll_('journal', rows);\n  return id;\n}\n\nfunction journalLines_() {\n  return readAll_('journal').map(function (l) {\n    l.account = String(l.account);\n    l.debit = Number(l.debit) || 0;\n    l.credit = Number(l.credit) || 0;\n    return l;\n  });\n}\n\nfunction decodeCsv_(base64, encoding) {\n  var bytes = Utilities.base64Decode(base64);\n  var blob = Utilities.newBlob(bytes);\n  if (encoding && encoding !== 'auto') return { text: blob.getDataAsString(encoding), encoding: encoding };\n  var utf = blob.getDataAsString('UTF-8');\n  if (utf.indexOf('�') < 0) return { text: utf, encoding: 'UTF-8' };\n  return { text: blob.getDataAsString('Shift_JIS'), encoding: 'Shift_JIS' };\n}\n\nfunction hash_(s) {\n  var d = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, s, Utilities.Charset.UTF_8);\n  return d.slice(0, 12).map(function (b) { return ('0' + (b & 0xff).toString(16)).slice(-2); }).join('');\n}\n\nfunction voucherFolder_() {\n  var s = getSettings_();\n  if (s.voucherFolderId) {\n    try { return DriveApp.getFolderById(s.voucherFolderId); } catch (e) { /* 作り直す */ }\n  }\n  var folder = DriveApp.createFolder(APP_TITLE + '_証憑');\n  setSetting_('voucherFolderId', folder.getId(), '証憑（領収書など）の保存フォルダ');\n  return folder;\n}\n\n/** 証憑を「日付_金額_取引先.拡張子」で保存（電子帳簿保存法の検索要件を名前で満たす） */\nfunction saveVoucher_(v, date, amount, partner) {\n  if (!v || !v.base64) return '';\n  var ext = (String(v.name || '').match(/\\.([A-Za-z0-9]+)$/) || [, 'pdf'])[1].toLowerCase();\n  var who = String(partner || '取引先不明').replace(/[\\\\\\/:*?\"<>|\\s]+/g, '').slice(0, 30);\n  var name = String(date).replace(/-/g, '') + '_' + amount + '_' + who + '.' + ext;\n  var blob = Utilities.newBlob(Utilities.base64Decode(v.base64), v.mime || 'application/octet-stream', name);\n  return voucherFolder_().createFile(blob).getUrl();\n}\n\nfunction cleanRule_(r) {\n  return {\n    _row: r._row, id: String(r.id), pattern: String(r.pattern || ''), direction: r.direction || 'any',\n    account: String(r.account || ''), ratio: Number(r.ratio) || 100,\n    enabled: !(r.enabled === false || String(r.enabled).toUpperCase() === 'FALSE'), note: r.note || ''\n  };\n}\n\nfunction stoneDict_() { return buildStoneDict(getSettings_().stoneDict || ''); }\n\nfunction salesRows_() {\n  return readAll_('sales').map(function (r) {\n    ['price', 'fee', 'ship', 'net'].forEach(function (k) { r[k] = Number(r[k]) || 0; });\n    r.stone = String(r.stone || 'その他'); r.shape = String(r.shape || 'その他');\n    return r;\n  });\n}\n\nfunction rules_() { return readAll_('rules').map(cleanRule_); }\n\n/* ───────── API ───────── */\n\nvar API_ = {\n\n  bootstrap: function () {\n    var s0 = getSettings_();\n    if (!readAll_('accounts').length || s0.inventory == null || !s0.shopDefaultV3 || !accMap_()[ACC_STOCK_CLOSE] || Object.keys(SCHEMA).some(function (k) { return !ss_().getSheetByName(SCHEMA[k].sheet); })) setup_();\n    var s = getSettings_();\n    return {\n      accounts: accounts_().map(function (a) { return { code: String(a.code), name: a.name, type: a.type, active: a.active !== false && String(a.active).toUpperCase() !== 'FALSE' }; }),\n      settings: { year: Number(s.year) || new Date().getFullYear(), deduction: Number(s.deduction) || 650000, aiModel: s.aiModel || DEFAULT_AI_MODEL,\n        inventory: String(s.inventory).toUpperCase() === 'TRUE', stockMethod: s.stockMethod === 'avg' ? 'avg' : 'last', fontScale: s.fontScale || 'l' },\n      presets: readAll_('presets').map(function (p) { try { return JSON.parse(p.json); } catch (e) { return null; } }).filter(Boolean),\n      aiProvider: aiProvider_(s),\n      aiKeys: { gemini: !!PropertiesService.getScriptProperties().getProperty(AI.gemini.keyProp), anthropic: !!PropertiesService.getScriptProperties().getProperty(AI.anthropic.keyProp) },\n      aiModels: { gemini: aiModel_('gemini', s), anthropic: aiModel_('anthropic', s) },\n      aiReady: !!PropertiesService.getScriptProperties().getProperty(AI[aiProvider_(s)].keyProp),\n      pending: readAll_('inbox').filter(function (i) { return i.status === 'pending'; }).length,\n      sheetUrl: ss_().getUrl()\n    };\n  },\n\n  dashboard: function (p) {\n    var year = Number(p.year);\n    var lines = journalLines_();\n    var st = buildStatements(lines, accounts_().map(function (a) { a.code = String(a.code); return a; }), year, getSettings_().deduction);\n    var entries = groupEntries(lines.filter(function (l) { return String(l.date).slice(0, 4) === String(year); }));\n    return {\n      pl: st.pl, monthly: st.monthly, balanced: st.bs.balanced,\n      pending: readAll_('inbox').filter(function (i) { return i.status === 'pending'; }).length,\n      recent: entries.slice(-6).reverse(),\n      entryCount: entries.length,\n      setup: {\n        opening: lines.some(function (l) { return l.source === 'opening' && String(l.date).slice(0, 4) === String(year); }),\n        cardPresets: readAll_('presets').filter(function (p) { return String(p.json).indexOf('\"kind\":\"sales\"') < 0; }).length,\n        salesPresets: readAll_('presets').filter(function (p) { return String(p.json).indexOf('\"kind\":\"sales\"') >= 0; }).length,\n        lots: readAll_('lots').length\n      }\n    };\n  },\n\n  /* ── CSV 取込 ── */\n\n  previewCsv: function (p) {\n    var d = decodeCsv_(p.base64, p.encoding);\n    var rows = textToRows(d.text);\n    return { encoding: d.encoding, total: rows.length, rows: rows.slice(0, 12) };\n  },\n\n  importCsv: function (p) {\n    var preset = p.preset;\n    if (!preset || !preset.name) throw new Error('取込元の名前を入力してください（例：楽天カード）');\n    if (!preset.counter) throw new Error('相手科目（カードなら未払金、銀行なら普通預金）を選んでください');\n    return withLock_(function () {\n      var d = decodeCsv_(p.base64, preset.encoding);\n      var parsed = csvToItems(parseCsv(d.text), preset);\n      var inbox = readAll_('inbox');\n      var known = {};\n      inbox.forEach(function (i) { known[i.source_hash] = true; });\n      var rules = rules_();\n      var ts = now_();\n      var seq = inbox.length;\n      var added = [], dup = 0, matched = 0;\n      parsed.items.forEach(function (it) {\n        var h = hash_(preset.name + '|' + it.key);\n        if (known[h]) { dup++; return; }\n        known[h] = true;\n        var r = matchRule(it.desc, it.direction, rules);\n        if (r) matched++;\n        seq++;\n        added.push({\n          id: 'I' + Utilities.formatDate(new Date(), tz_(), 'yyMMddHHmmss') + '-' + seq,\n          date: it.date, direction: it.direction, amount: it.amount, desc: it.desc, source: preset.name,\n          counter: preset.counter, source_hash: h, suggested: r ? r.account : '', ratio: r ? r.ratio : 100,\n          status: 'pending', entry_id: '', note: r ? 'ルール: ' + r.pattern : '', imported_at: ts\n        });\n      });\n      appendAll_('inbox', added);\n      if (p.savePreset) {\n        preset.encoding = d.encoding;\n        var presets = readAll_('presets');\n        var hit = presets.filter(function (x) { return x.name === preset.name; })[0];\n        if (hit) { hit.json = JSON.stringify(preset); updateAll_('presets', [hit]); }\n        else appendAll_('presets', [{ name: preset.name, json: JSON.stringify(preset) }]);\n      }\n      return { added: added.length, duplicates: dup, matched: matched, skipped: parsed.skipped, encoding: d.encoding };\n    });\n  },\n\n  deletePreset: function (p) {\n    var rows = readAll_('presets').filter(function (x) { return x.name === p.name; }).map(function (x) { return x._row; });\n    deleteRows_('presets', rows);\n    return true;\n  },\n\n  /* ── 要確認 ── */\n\n  inbox: function () {\n    return readAll_('inbox').filter(function (i) { return i.status === 'pending'; })\n      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })\n      .map(function (i) { delete i._row; i.amount = Number(i.amount); i.ratio = Number(i.ratio) || 100; return i; });\n  },\n\n  /** items: [{id, account, ratio, saveRule, pattern}] */\n  postInbox: function (p) {\n    return withLock_(function () {\n      var accMap = accMap_();\n      var inbox = readAll_('inbox');\n      var byId = {};\n      inbox.forEach(function (i) { byId[i.id] = i; });\n      var journal = journalLines_();\n      var rules = readAll_('rules');\n      var posted = 0, errors = [], newRules = [], changed = [], buf = [];\n      (p.items || []).forEach(function (sel) {\n        var it = byId[sel.id];\n        if (!it || it.status !== 'pending') return;\n        try {\n          if (!sel.account) throw new Error('科目が未選択です');\n          it.amount = Number(it.amount);\n          it.counter = String(it.counter);\n          var form = itemToForm(it, String(sel.account), sel.ratio);\n          var lines = buildEntryLines(form, accMap);\n          var id = writeEntry_(journal, form.date, lines, { memo: it.desc, partner: '', source: 'csv:' + it.source, source_hash: it.source_hash }, accMap, buf);\n          it.status = 'posted'; it.entry_id = id; it.suggested = String(sel.account); it.ratio = form.ratio;\n          changed.push(it);\n          posted++;\n          if (sel.saveRule && sel.pattern) {\n            var exists = rules.concat(newRules).some(function (r) { return String(r.pattern) === sel.pattern && (r.direction === it.direction || r.direction === 'any'); });\n            if (!exists) newRules.push({ id: 'R' + (rules.length + newRules.length + 1) + '-' + Date.now() % 100000, pattern: sel.pattern, direction: it.direction, account: String(sel.account), ratio: Number(sel.ratio) || 100, enabled: true, note: '' });\n          }\n        } catch (e) {\n          errors.push({ id: sel.id, desc: it.desc, message: e.message });\n        }\n      });\n      appendAll_('journal', buf);\n      updateAll_('inbox', changed);\n      appendAll_('rules', newRules);\n      return { posted: posted, errors: errors, rulesAdded: newRules.length };\n    });\n  },\n\n  skipInbox: function (p) {\n    var ids = {};\n    (p.ids || []).forEach(function (id) { ids[id] = true; });\n    var rows = readAll_('inbox').filter(function (i) { return ids[i.id] && i.status === 'pending'; });\n    rows.forEach(function (i) { i.status = 'skipped'; });\n    updateAll_('inbox', rows);\n    return rows.length;\n  },\n\n  /** 未分類の明細を AI に推定させる（推定のみ。確定は画面で人が行う） */\n  aiSuggest: function (p) {\n    var ids = {};\n    (p.ids || []).forEach(function (id) { ids[id] = true; });\n    var targets = readAll_('inbox').filter(function (i) { return ids[i.id] && i.status === 'pending'; }).slice(0, 40);\n    if (!targets.length) return { updated: 0 };\n    var accs = accounts_().filter(function (a) { return a.type === '費用' || a.type === '収益' || a.type === '原価' || a.code == ACC_PRIVATE_OUT || a.code == ACC_PRIVATE_IN; });\n    var prompt = [\n      'あなたは日本の個人事業主（青色申告）の記帳を補助します。',\n      '次の明細それぞれに、最も適切な勘定科目コードを1つ選んでください。',\n      '事業と無関係と思われる支出は 190（事業主貸）、事業と無関係な入金は 290（事業主借）を選んでください。',\n      '判断がつかない場合は account を空文字にしてください。',\n      '',\n      '勘定科目: ' + accs.map(function (a) { return a.code + ':' + a.name; }).join(', '),\n      '',\n      '明細(JSON): ' + JSON.stringify(targets.map(function (t) { return { id: t.id, desc: t.desc, amount: Number(t.amount), direction: t.direction === 'out' ? '支出' : '入金' }; })),\n      '',\n      '出力は JSON 配列のみ: [{\"id\":\"...\",\"account\":\"コード\",\"reason\":\"20字以内の理由\"}]'\n    ].join('\\n');\n    var text = ca <script>
/*
 * runtime.js — ブラウザだけで動かすための実行基盤
 * ・Google Apps Script のサービス（スプレッドシート等）を、ブラウザ内のデータに置き換える
 * ・データはブラウザ（IndexedDB）と、選んだ「帳簿ファイル」（JSON）に自動保存する

(function () {
  'use strict';

  /* ───────── 保存（IndexedDB と帳簿ファイル） ───────── */
  const IDB_NAME = 'aoiro-ledger', STORE = 'kv';
  const FS_OK = 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
  const L = window.LEDGER = {
    data: null,          // { app, version, savedAt, sheets:{名前: 2次元配列}, props:{} }
    secrets: {},         // APIキー（帳簿ファイルには書かない）
    handle: null,        // 帳簿ファイルのハンドル
    status: 'local',     // local / file / need-permission / saving / error

  async function readHandle(h) {

      L.data = local; L.cloudEtag = r.body.etag; L.pending = true;
    } else {
      if (hasContent(local) && (rec.pending || !rec.user) && JSON.stringify(local.sheets) !== JSON.stringify(r.body.data.sheets)) {

const yen = n => { n = Number(n) || 0; return (n < 0 ? '△' : '') + Math.abs(n).toLocaleString('ja-JP'); };
const toInt = v => { const s = String(v == null ? '' : v).normalize('NFKC').replace(/[,¥円\s]/g, ''); return /^-?\d+$/.test(s) ? parseInt(s, 10) : NaN; };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

function call(method, payload) {
  return new Promise((res, rej) => google.script.run
    .withSuccessHandler(res)
    .withFailureHandler(e => rej(e))
    .api(method, payload || {}));
}

let busyCount = 0, busyTimer = null;
function busyMsg(t) {
  let m = $('#busyMsg');
  if (!m) { m = document.createElement('div'); m.id = 'busyMsg'; $('#busy').appendChild(m); }
  m.textContent = t || '';
}
async function run(method, payload, { quiet = false } = {}) {
  if (!quiet) {
    busyCount++; $('#busy').hidden = false; busyMsg('');
    clearTimeout(busyTimer);
    const t0 = Date.now();
    const tick = () => {
      const sec = Math.round((Date.now() - t0) / 1000);
      busyMsg(sec < 60 ? `処理しています…（${sec}秒）データが多いと30秒ほどかかります` : `まだ処理しています（${sec}秒）。2分以上続く場合は、Apps Script の「実行数」でエラーが出ていないかご確認ください`);
      busyTimer = setTimeout(tick, 1000);
    };
    busyTimer = setTimeout(tick, 2500);
  }
  try { return await call(method, payload); }
  catch (e) { toast((e && e.message) || String(e), true); throw e; }
  finally { if (!quiet && --busyCount <= 0) { busyCount = 0; clearTimeout(busyTimer); busyMsg(''); $('#busy').hidden = true; } }
}

let toastTimer;
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');

/** "3×48" "3*48" → 数量 */
function qtyOf(v) {
  const s = String(v == null ? '' : v).normalize('NFKC').replace(/,/g, '').replace(/[x×]/gi, '*').trim();
  if (!s) return 0;
  if (!/^[\d.]+(\*[\d.]+)*$/.test(s)) return NaN;
  return s.split('*').reduce((p, x) => p * parseFloat(x), 1);
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* 表をスマホでカード表示にするため、各セルに見出しの名前を付ける */
function labelTables(root) {
  const PAGE = 20;
  $$('.tbl-wrap table:not(.csv)', root).forEach(t => {
    const th = $$('thead th', t).map(x => x.textContent.trim());
    if (!th.length) return;
    // 列が少ない表はスマホでもそのまま表で見せる（縦に長くならないように）
    if (th.length <= 3) { t.classList.add('rt-keep'); return; }
    t.classList.add('rt');
    const rows = $$('tbody tr', t);
    rows.forEach((tr, i) => {
      let col = 0;
      Array.from(tr.children).forEach((td, k) => {
        const span = Number(td.getAttribute('colspan') || 1);
        const label = span === 1 ? th[col] : '';
        if (label && !td.hasAttribute('data-label')) td.setAttribute('data-label', label);
        if (k === 0) td.classList.add('rt-head');
        else if (!label || td.querySelector('.ellipsis,textarea') || (td.matches('.lines') ? Array.from(td.children).some(d => d.textContent.trim().length > 13) : td.textContent.trim().length > 14)) td.classList.add('rt-wide');
        col += span;
      });
      tr.classList.toggle('rt-more', i >= PAGE && !t.dataset.all);
    });
    const wrap = t.closest('.tbl-wrap');
    let btn = wrap.nextElementSibling && wrap.nextElementSibling.classList.contains('rt-morebtn') ? wrap.nextElementSibling : null;
    const hiddenN = rows.length - PAGE;
    if (hiddenN > 0 && !t.dataset.all) {
      if (!btn) {
        btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'btn rt-morebtn';
        btn.onclick = () => { t.dataset.all = '1'; $$('tr.rt-more', t).forEach(r => r.classList.remove('rt-more')); btn.remove(); };
        wrap.after(btn);
      }
      btn.textContent = `残り ${hiddenN} 件をすべて表示`;
    } else if (btn) btn.remove();
  });
}
let labelTimer;
new MutationObserver(() => { clearTimeout(labelTimer); labelTimer = setTimeout(() => labelTables(document), 30); })

function sparkBars(vals, upto) {
  const W = 220, H = 64, n = vals.length, gap = 5, bw = (W - gap * (n - 1)) / n;
  const max = Math.max(1, ...vals);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a6bff"/><stop offset="1" stop-color="#5b4cf0"/></linearGradient>
    <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d4ff"/><stop offset="1" stop-color="#efedff"/></linearGradient></defs>
    ${vals.map((v, i) => { const h = Math.max(3, (H - 2) * v / max); return `<rect x="${i * (bw + gap)}" y="${H - h}" width="${bw}" height="${h}" rx="3" fill="${i === upto ? 'url(#gb)' : i < upto ? 'url(#gs)' : '#f3f3f8'}"><title>${i + 1}月 ${yen(v)}円</title></rect>`; }).join('')}</svg>`;
}

function sparkLine(vals) {
  const W = 220, H = 64, n = vals.length;
  const min = Math.min(0, ...vals), max = Math.max(1, ...vals);
  const pts = vals.map((v, i) => [n === 1 ? W / 2 : 4 + (W - 8) * i / (n - 1), 6 + (H - 12) * (1 - (v - min) / (max - min || 1))]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a6bff" stop-opacity=".25"/><stop offset="1" stop-color="#7a6bff" stop-opacity="0"/></linearGradient></defs>
    ${pts.length > 1 ? `<path d="${d} L${pts[pts.length - 1][0]} ${H} L${pts[0][0]} ${H} Z" fill="url(#gl)"/><path d="${d}" fill="none" stroke="#5b4cf0" stroke-width="2"/>` : ''}
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="#5b4cf0" stroke-width="2"/>`).join('')}</svg>`;
}

function deltaText(cur, prev) {
  if (!prev) return cur ? '' : '';
  const pct = Math.round((cur - prev) / Math.abs(prev) * 1000) / 10;
  return `<span class="${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '↑' : '↓'} ${Math.abs(pct)}%</span> 前月比`;
}

function monthlyChart(m) {
  const W = 640, H = 200, P = { l: 44, r: 6, t: 8, b: 22 };
  const vals = m.map(x => ({ s: x.sales + x.misc, c: x.purchase + x.expense }));
  const max = Math.max(1, ...vals.map(v => Math.max(v.s, v.c)));
  const step = niceStep(max);
  const top = Math.ceil(max / step) * step;
  const cw = (W - P.l - P.r) / 12, bw = Math.min(14, cw / 3);
  const y = v => P.t + (H - P.t - P.b) * (1 - Math.max(0, v) / top);
  let g = '';
  for (let v = 0; v <= top; v += step) {
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.14)"/>` +
      `<text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#dcd8ff">${v >= 10000 ? (v / 10000) + '万' : v}</text>`;
  }
  vals.forEach((v, i) => {
    const x = P.l + cw * i + cw / 2;
    g += `<rect x="${x - bw - 1}" y="${y(v.s)}" width="${bw}" height="${y(0) - y(v.s)}" rx="3" fill="#fff"><title>${i + 1}月 売上 ${yen(v.s)}円</title></rect>`;
    g += `<rect x="${x + 1}" y="${y(v.c)}" width="${bw}" height="${y(0) - y(v.c)}" rx="3" fill="#a99ffd"><title>${i + 1}月 経費 ${yen(v.c)}円</title></rect>`;
    g += `<text x="${x}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#dcd8ff">${i + 1}月</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の売上と経費">${g}</svg>`;
}
function niceStep(max) {
  const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

/** 見出しから列を推測 */
function guessMapping(rows) {
  const hdrIdx = rows.findIndex(r => r.some(c => /日/.test(c)) && r.some(c => /金額|出金|支払|入金|利用額/.test(c)));
  const h = hdrIdx >= 0 ? rows[hdrIdx] : [];
  const find = re => h.findIndex(c => re.test(String(c)));
  const out = find(/出金|お支払|引出|支払金額/), inn = find(/入金|預入|お預り/);
  const split = out >= 0 && inn >= 0;
  const isBank = split || h.some(c => /残高/.test(c));
  return {
    headerRows: hdrIdx >= 0 ? hdrIdx + 1 : 0,
    dateCol: Math.max(0, find(/日/)),
    descCol: Math.max(0, find(/店|摘要|内容|名称|利用先|お取引/)),
    memoCol: '',
    amountMode: split ? 'split' : 'single',
    amountCol: Math.max(0, find(/金額|利用額|支払額/)),
    outCol: Math.max(0, out), inCol: Math.max(0, inn),
    sign: 'outflowPositive',
    counter: isBank ? '102' : '202',
    encoding: 'auto', name: ''
  };
}

  $('#doImport').onclick = doImport;
