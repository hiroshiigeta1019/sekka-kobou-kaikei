};

async function loadInventory() {
  const date = $('#iDate').value;
  let [data, uc] = await Promise.all([run('inventory', { date }, { quiet: true }), run('unitCosts', { asOf: date }, { quiet: true })]);
  S.uc = uc;
  if (!data.rows.length && S.invCopy && S.invRows && S.invRows.length) {
    data = { rows: S.invRows.map(r => Object.assign({}, r, { count_date: date })), copied: true };
  }
  S.invCopy = false;
  S.invRows = data.rows.length ? data.rows : [{ category: '仕入品', item: '', spec: '', unit: '個', qty: '', unit_cost: '', note: '' }];
  const year = Number(date.slice(0, 4));
  $('#iBody').innerHTML = `
    ${data.copied ? '<div class="note">前の棚卸をひな形として読み込みました。数量を今の在庫に直してから保存してください。</div>' : ''}
    <div class="card" style="padding:12px 16px"><div class="row">
      <button class="btn" id="iFill" ${uc.length ? '' : 'disabled title="「石の仕入」で明細を登録すると使えます"'}>仕入明細の品目を並べる（${uc.length}品目）</button>
      <button class="btn" id="iEst" ${uc.length ? '' : 'disabled'}>在庫の目安を数量に入れる</button>
      <span style="flex:1"></span>
      <select id="iMethod" style="width:auto">
        <option value="last" ${S.boot.settings.stockMethod !== 'avg' ? 'selected' : ''}>最終仕入原価法（届出なしの場合の方法）</option>
        <option value="avg" ${S.boot.settings.stockMethod === 'avg' ? 'selected' : ''}>平均単価（総平均法などの届出をした場合）</option></select>
      <button class="btn" id="iPrice" ${uc.length ? '' : 'disabled'}>単価を自動で入れる</button>
    </div></div>
    <div class="tbl-wrap"><table class="inv">
      <thead><tr><th>区分</th><th>石の種類</th><th>形・サイズ</th><th>単位</th><th class="num">数量</th><th class="num">単価</th><th class="num">金額</th><th>単価の根拠・メモ</th><th></th></tr></thead>
      <tbody id="iRows"></tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn sm" id="iAdd">＋ 行を追加</button><span style="flex:1"></span>
      <span id="iTotals" class="small"></span><button class="btn primary" id="iSave">保存</button></div>

    <div class="grid two" style="margin-top:18px">
      <div class="card"><h2>決算に反映（${year}年12月31日の期末在庫）</h2>
        <p class="small muted" style="margin-top:-6px">この棚卸の合計を ${year}年の期末在庫として、12月31日付の振替仕訳（期首商品棚卸高／商品、商品／期末商品棚卸高）を作ります。何度実行しても作り直されるだけです。</p>
        ${date.slice(5) !== '12-31' ? '<div class="note warn">棚卸日が12月31日ではありません。決算に使うのは原則として12月31日時点の在庫です。</div>' : ''}
        <button class="btn primary" id="iApply">${year}年の決算に反映</button></div>
      <div class="card"><h2>1月1日の在庫を逆算する</h2>
        <p class="small muted" style="margin-top:-6px">前年末に棚卸をしていなかった場合に使います。<br>期首在庫 ＝ この棚卸の在庫 ＋ 1月1日〜棚卸日に売れた分の原価 − 同期間の仕入</p>
        <div class="form"><label class="f">売れた分の原価（わかれば）<input id="rcCost" inputmode="numeric" placeholder="空欄なら原価率で計算"></label>
          <label class="f">原価率（%）<input type="number" id="rcRatio" min="0" max="100" value="35"></label>
          <div><button class="btn" id="rcCalc">計算する</button></div></div>
        <div id="rcOut"></div></div>
    </div>`;
  drawInvRows();
  $('#iFill').onclick = () => {
    const have = new Set(S.invRows.filter(r => r.item).map(r => keyOf(r.item, r.spec)));
    const add = S.uc.filter(u => !have.has(keyOf(u.stone, u.size))).map(u => ({ category: '仕入品', item: u.stone, spec: u.size, unit: '個', qty: '', unit_cost: '', note: '' }));
    S.invRows = S.invRows.filter(r => r.item || r.qty).concat(add);
    drawInvRows(); toast(`${add.length}品目を追加しました。数えた数を入れてください`);
  };
  $('#iEst').onclick = async () => {
    const stk = await run('stockStatus', {}, { quiet: true });
    const est = Object.fromEntries(stk.map(x => [keyOf(x.stone, x.shape), x]));
    const have = new Set(S.invRows.filter(r => r.item).map(r => keyOf(r.item, r.spec)));
    S.invRows = S.invRows.filter(r => r.item || r.qty);
    stk.filter(x => x.bought && !have.has(keyOf(x.stone, x.shape))).forEach(x => S.invRows.push({ category: '仕入品', item: x.stone, spec: x.shape, unit: '個', qty: '', unit_cost: '', note: '' }));
    let n = 0;
    S.invRows.forEach(r => { const x = est[keyOf(r.item, r.spec)]; if (x && x.bought) { r.qty = Math.max(0, x.left); n++; } });
    drawInvRows();
    $('#iPrice').click();
    toast(`${n}品目に在庫の目安と単価を入れました。実際に数えて違うところだけ直してください`);
  };
  $('#iPrice').onclick = () => {
    const method = $('#iMethod').value;
    const map = Object.fromEntries(S.uc.map(u => [keyOf(u.stone, u.size), u]));
    let n = 0, miss = 0;
    S.invRows.forEach(r => {
      if (!r.item) return;
      const u = map[keyOf(r.item, r.spec)];
      if (!u) { miss++; return; }
      r.unit_cost = method === 'avg' ? u.avg : u.last;
      r.note = method === 'avg' ? `平均単価（${u.lots}件・${u.qty}粒）` : `最終仕入 ${u.lastDate}${u.lastKind !== '仕入' ? '（' + u.lastKind + '）' : ''}`;
      n++;
    });
    if (method !== S.boot.settings.stockMethod) { S.boot.settings.stockMethod = method; call('saveSettings', { stockMethod: method }).catch(() => { }); }
    drawInvRows(); toast(`${n}行に単価を入れました` + (miss ? `（仕入明細にない ${miss}行は手入力してください）` : ''));
  };
  $('#iAdd').onclick = () => { S.invRows.push({ category: S.invRows[S.invRows.length - 1].category, item: '', spec: '', unit: '', qty: '', unit_cost: '', note: '' }); drawInvRows(); };
  $('#iSave').onclick = async () => {
    const r = await run('saveInventory', { date: $('#iDate').value, rows: S.invRows });
    S.invDate = $('#iDate').value; toast(`保存しました（合計 ${yen(r.total)}円）`); go('stock');
  };
  $('#iApply').onclick = async () => {
    const r = await run('applyInventory', { year, date: $('#iDate').value });
    toast(`反映しました：期首在庫 ${yen(r.opening)}円 → 期末在庫 ${yen(r.closing)}円`);
  };
  $('#rcCalc').onclick = async () => {
    const r = await run('reconstructStock', { date: $('#iDate').value, soldCost: $('#rcCost').value.trim() === '' ? '' : toInt($('#rcCost').value), costRatio: Number($('#rcRatio').value) });
    $('#rcOut').innerHTML = `<table class="stmt" style="margin-top:12px"><tbody>
      <tr><td>${r.to} の在庫（この棚卸）</td><td class="num">${yen(r.count)}</td></tr>
      <tr><td>＋ 売れた分の原価${$('#rcCost').value.trim() === '' ? `（売上 ${yen(r.sales)} × ${$('#rcRatio').value}%）` : ''}</td><td class="num">${yen(r.soldCost)}</td></tr>
      <tr><td>− 同期間の仕入（仕入高）</td><td class="num">${yen(r.purchases)}</td></tr>
      <tr class="total"><td>${year}年1月1日の在庫（推定）</td><td class="num">${yen(r.estimate)}</td></tr></tbody></table>
      ${r.estimate < 0 ? '<div class="note warn" style="margin-top:10px">マイナスになりました。仕入や売上の記帳漏れ、または原価率の見直しが必要です（売上の記帳がまだの場合は、先に販売の取込を済ませてください）。</div>'
        : `<p class="small muted">この金額は推定値です。計算の根拠（棚卸表・販売履歴・原価率の考え方）を保存しておいてください。</p>
      <button class="btn" id="rcSet">${year}年の期首在庫（商品）に設定</button>`}`;
    const set = $('#rcSet');
    if (set) set.onclick = async () => { await run('setOpeningAccount', { year, code: '130', amount: r.estimate }); toast('期首在庫を設定しました（元入金も再計算しました）'); };
  };
}

const keyOf = (stone, size) => String(stone || '').normalize('NFKC').toLowerCase().replace(/\s/g, '') + '|' + String(size || '').normalize('NFKC').toLowerCase().replace(/\s/g, '');

function drawInvRows() {
  const units = ['個', '粒', '連', '本', 'g', 'm', '袋', '点'];
  const stones = [...new Set((S.uc || []).map(u => u.stone))], sizes = [...new Set((S.uc || []).map(u => u.size).concat(['勾玉', 'ポイント', 'ダブルポイント', '丸玉', 'さざれ', '原石', 'タンブル', '彫刻', 'ビーズ']))];
  $('#iRows').innerHTML = S.invRows.map((r, i) => `<tr data-i="${i}">
    <td><select data-k="category">${INV_CATS.map(c => `<option ${r.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></td>
    <td><input data-k="item" value="${esc(r.item)}" list="stones" placeholder="例：ローズクォーツ"></td>
    <td><input data-k="spec" value="${esc(r.spec)}" list="sizes" placeholder="例：勾玉" style="width:100px"></td>
    <td><input data-k="unit" value="${esc(r.unit || '個')}" list="units" style="width:60px"></td>
    <td><input data-k="qty" value="${esc(r.qty)}" inputmode="decimal" placeholder="3×48" style="width:84px;text-align:right"></td>
    <td><input data-k="unit_cost" value="${esc(r.unit_cost)}" inputmode="decimal" style="width:84px;text-align:right"></td>
    <td class="num amt"></td>
    <td><input data-k="note" value="${esc(r.note)}" placeholder="単価の根拠"></td>
    <td><button class="btn sm ghost" data-del="${i}">削除</button></td></tr>`).join('') +
    `<datalist id="units">${units.map(u => `<option value="${u}">`).join('')}</datalist>` +
    `<datalist id="stones">${stones.map(u => `<option value="${esc(u)}">`).join('')}</datalist>` +
    `<datalist id="sizes">${sizes.map(u => `<option value="${esc(u)}">`).join('')}</datalist>`;
  $$('#iRows tr').forEach(tr => {
    const i = Number(tr.dataset.i);
    $$('[data-k]', tr).forEach(inp => inp.oninput = inp.onchange = () => { S.invRows[i][inp.dataset.k] = inp.value; invTotals(); });
    $('[data-k=qty]', tr).onblur = e => { const q = qtyOf(e.target.value); if (q && String(q) !== e.target.value) { e.target.value = q; S.invRows[i].qty = q; invTotals(); } };
  });
  $$('[data-del]').forEach(b => b.onclick = () => { S.invRows.splice(Number(b.dataset.del), 1); if (!S.invRows.length) S.invRows.push({ category: '仕入品', unit: '個' }); drawInvRows(); });
  invTotals();
}

function invTotals() {
  const by = {}; let total = 0;
  $$('#iRows tr').forEach(tr => {
    const r = S.invRows[Number(tr.dataset.i)];
    const amt = Math.round((qtyOf(r.qty) || 0) * (parseFloat(String(r.unit_cost || '').replace(/,/g, '')) || 0));
    $('.amt', tr).textContent = amt ? yen(amt) : '';
    by[r.category] = (by[r.category] || 0) + amt; total += amt;
  });
  $('#iTotals').innerHTML = Object.keys(by).filter(k => by[k]).map(k => `${esc(k)} ${yen(by[k])}`).join('　') + `　<b>合計 ${yen(total)} 円</b>`;
}

    $('#lRows').innerHTML = S.lLines.map((l, i) => `<tr data-i="${i}">
      <td><input data-k="stone" list="stones" value="${esc(l.stone)}" placeholder="例：ローズクォーツ"></td>
      <td><input data-k="size" list="sizes" value="${esc(l.size)}" placeholder="例：勾玉" style="width:100px"></td>
      <td><input data-k="qty" value="${esc(l.qty)}" inputmode="decimal" placeholder="3×48" style="width:100px;text-align:right"></td>
      <td><input data-k="amount" value="${esc(l.amount)}" inputmode="numeric" style="width:110px;text-align:right"></td>
      <td class="num per"></td><td><button class="btn sm ghost" data-x="${i}" ${S.lLines.length < 2 ? 'disabled' : ''}>削除</button></td></tr>`).join('');
    $$('#lRows tr').forEach(tr => {
      const i = Number(tr.dataset.i);
      $$('[data-k]', tr).forEach(inp => inp.oninput = () => { S.lLines[i][inp.dataset.k] = inp.value; calc(); });
    });
    $$('[data-x]').forEach(b => b.onclick = () => { S.lLines.splice(Number(b.dataset.x), 1); draw(); });
    calc();
  };
  const calc = () => {
    const extra = $('#lExtra') ? (toInt($('#lExtra').value) || 0) : 0;
    const amts = S.lLines.map(l => toInt(l.amount) || 0), sum = amts.reduce((a, b) => a + b, 0);
    $$('#lRows tr').forEach(tr => {
      const l = S.lLines[Number(tr.dataset.i)], q = qtyOf(l.qty), a = toInt(l.amount) || 0;
      const withExtra = sum ? a + extra * a / sum : a;
      $('.per', tr).textContent = q > 0 && a ? (withExtra / q).toFixed(2) + ' 円' : '';
    });
    $('#lTotal').innerHTML = `合計 <b>${yen(sum + extra)}</b> 円`;
  };
  if ($('#lExtra')) $('#lExtra').oninput = calc;
  $('#lAdd').onclick = () => { S.lLines.push({ stone: '', size: S.lLines[S.lLines.length - 1].size, qty: '', amount: '' }); draw(); };
  $('#lSave').onclick = async () => {
    const payload = { date: $('#lDate').value, kind: S.lk, lines: S.lLines, partner: $('#lPartner').value.trim(), note: $('#lPartner').value.trim(),
      extra: $('#lExtra') ? $('#lExtra').value : 0, credit: $('#lCredit') ? $('#lCredit').value : '', makeEntry: $('#lEntry') ? $('#lEntry').checked : false };
    const r = await run('addLots', payload);
    S.lastDate = payload.date; S.lLines = null;
    toast(`登録しました（合計 ${yen(r.total)}円${r.entry_id ? '・仕訳 ' + r.entry_id : ''}）`); go('lots');
  };
  $$('[data-fill]').forEach(c => c.onclick = () => {
    const [stone, shape] = c.dataset.fill.split('|');
    const empty = S.lLines.find(l => !l.stone);
    if (empty) { empty.stone = stone; empty.size = shape; } else S.lLines.push({ stone, size: shape, qty: '', amount: '' });
    draw(); window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $$('[data-delg]').forEach(b => b.onclick = async () => {
    if (!confirmInline(b)) return;
    const r = await run('deleteLotGroup', { group: b.dataset.delg });
    toast('削除しました' + (r.reversed ? `（仕訳 ${r.reversed} は逆仕訳で取消）` : '')); go('lots');
  });
  draw();
};

/** ブラウザのダイアログを使わず、ボタンを2回押して確定 */
function confirmInline(btn) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; const t = btn.textContent; btn.textContent = 'もう一度押すと取消'; btn.classList.add('red');
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = t; btn.classList.remove('red'); }, 3000);
  return false;
}

function journalRow(e) {
  const dr = e.lines.filter(l => l.debit), cr = e.lines.filter(l => l.credit);
  const src = e.source === 'manual' ? '手入力' : e.source === 'opening' ? '期首' : e.source === 'reversal' ? '取消' : String(e.source).replace(/^csv:/, '');
  const dim = e.reversed_by || e.reversal_of;
  return `<tr class="${dim ? 'dim' : ''}">
    <td class="small" style="white-space:nowrap">${e.date}<div class="muted">${e.entry_id}</div></td>
    <td class="lines">${dr.map(l => `<div><span>${esc(accName(l.account))}</span><span class="num">${yen(l.debit)}</span></div>`).join('')}</td>
    <td class="lines">${cr.map(l => `<div><span>${esc(accName(l.account))}</span><span class="num">${yen(l.credit)}</span></div>`).join('')}</td>
    <td><div class="ellipsis">${esc(e.memo)}</div>${e.partner ? `<div class="small muted">${esc(e.partner)}</div>` : ''}</td>
    <td><span class="tag">${esc(src)}</span>${e.voucher_url ? ` <a class="small" href="${esc(e.voucher_url)}" target="_blank" rel="noopener">証憑</a>` : ''}</td>
    <td style="text-align:right">${e.reversed_by ? `<span class="tag warn">取消済</span>` : e.reversal_of ? `<span class="small muted">${e.reversal_of}の取消</span>` : e.source === 'opening' ? '' : `<button class="btn sm" data-rev="${e.entry_id}">取消</button>`}</td>
  </tr>`;
}

function guideView(r) {
  const p = r.pl, b = r.bs;
  const amt = code => (p.expenses.find(x => x.code === code) || {}).amount || 0;
  const cg = Object.fromEntries(p.cogs.map(x => [x.code, x.amount]));
  const others = p.expenses.filter(x => x.amount && !FORM_EXPENSES.includes(x.code) && x.code !== '699');
  const row = (field, v, where, note) => `<tr><td><b>${field}</b>${note ? `<div class="small muted">${note}</div>` : ''}</td><td class="num"><b>${v === '' ? '' : yen(v)}</b></td><td class="small">${where || ''}</td></tr>`;

  const step = (n, title, body) => `<div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:14px">
    <div class="step" style="border:0;padding:0;cursor:default"><div class="n">${n}</div></div><div style="flex:1;min-width:0"><h2 style="margin-bottom:8px">${title}</h2>${body}</div></div></div>`;
  return `
  <div class="note">提出は翌年の<b>2月16日〜3月15日</b>ごろです（土日の場合は変わります）。国税庁の「<b>確定申告書等作成コーナー</b>」で画面の質問に答えながら入力し、<b>e-Tax（マイナンバーカード）で送信</b>すると、青色申告特別控除が65万円になります。<br>
  欄の番号（①②…）は年によって変わることがあるため、ここでは<b>欄の名前</b>で案内しています。紙の様式でも同じ名前の欄を探してください。</div>

  ${step(1, 'そろえるもの', `<ul style="margin:0;padding-left:22px">
    <li>会社からもらう<b>源泉徴収票</b>（給与の分。年末調整を受けていても必要です）</li>
    <li><b>マイナンバーカード</b>とスマホ（e-Taxで送信するため）</li>
    <li>控除の証明書：生命保険料・地震保険料・ふるさと納税・医療費（10万円超など）・iDeCo など</li>

function plView(r) {
  const p = r.pl;
  const row = (name, v, cls) => `<tr class="${cls || ''}"><td>${esc(name)}</td><td class="num">${yen(v)}</td></tr>`;
  return `<div class="card" style="max-width:640px"><table class="stmt"><tbody>
    <tr class="h"><td colspan="2">売上（収入）金額（雑収入を含む）</td></tr>
    ${p.revenue.filter(x => x.amount).map(x => row(x.name, x.amount, 'sub')).join('')}
    ${row('売上（収入）金額 計', p.totalRevenue, 'total')}
    <tr class="h"><td colspan="2">売上原価</td></tr>
    ${(() => { const c = Object.fromEntries(p.cogs.map(x => [x.code, x.amount])); return (c['510'] || c['520'])
      ? row('期首商品棚卸高', c['510'] || 0, 'sub') + row('仕入金額', c['501'] || 0, 'sub') + row('期末商品棚卸高', -(c['520'] || 0), 'sub') + row('差引原価', p.totalCogs, 'total')
      : row('仕入金額', p.totalCogs, 'sub'); })()}
    ${row('差引金額', p.gross, 'total')}
    <tr class="h"><td colspan="2">経費</td></tr>
    ${p.expenses.filter(x => x.amount).map(x => row(x.name, x.amount, 'sub')).join('') || '<tr><td class="muted small" colspan="2">まだありません</td></tr>'}
    ${row('経費 計', p.totalExpenses, 'total')}
    ${row('青色申告特別控除前の所得金額', p.income, 'total')}
    ${row('青色申告特別控除額', p.deduction)}
    ${row('所得金額', p.incomeAfter, 'total')}
  </tbody></table>
  <p class="small muted">控除額の上限は ${yen(p.deductionCap)} 円で設定しています。65万円控除は、複式簿記での記帳に加えて e-Tax での提出（または優良電子帳簿保存）が条件です。在庫がある場合は、棚卸画面で12月31日の棚卸を「決算に反映」すると売上原価に入ります。</p></div>`;
}

function bsView(r) {
  const b = r.bs;
  const side = (title, rows, extra, total) => `<div class="card"><h2>${title}</h2><table class="stmt">
    <thead><tr><th>科目</th><th class="num">1月1日（期首）</th><th class="num">12月31日（期末）</th></tr></thead><tbody>
    ${rows.filter(x => x.opening || x.closing).map(x => `<tr><td>${esc(x.name)}</td><td class="num">${yen(x.opening)}</td><td class="num">${yen(x.closing)}</td></tr>`).join('')}
    ${extra || ''}<tr class="total"><td>合計</td><td class="num">${yen(total.opening)}</td><td class="num">${yen(total.closing)}</td></tr></tbody></table></div>`;
  return `${b.balanced ? '' : '<div class="note warn">資産の部と負債・資本の部の合計が一致していません。期首残高（設定画面）を確認してください。</div>'}
    <div class="grid bs">${side('資産の部', b.assets, '', b.totalAssets)}
    ${side('負債・資本の部', b.liabilities, `<tr><td>青色申告特別控除前の所得金額</td><td class="num"></td><td class="num">${yen(b.income)}</td></tr>`, b.totalLiabilities)}</div>`;
}

function monthlyView(r) {
  const m = r.monthly, sum = k => m.reduce((s, x) => s + x[k], 0);
  return `<div class="card" style="max-width:640px"><table class="stmt">
    <thead><tr><th>月</th><th class="num">売上（収入）金額</th><th class="num">仕入金額</th></tr></thead><tbody>
    ${m.map(x => `<tr><td>${x.month}月</td><td class="num">${yen(x.sales)}</td><td class="num">${yen(x.purchase)}</td></tr>`).join('')}
    <tr><td>雑収入</td><td class="num">${yen(sum('misc'))}</td><td></td></tr>
    <tr class="total"><td>計</td><td class="num">${yen(sum('sales') + sum('misc'))}</td><td class="num">${yen(sum('purchase'))}</td></tr>
  </tbody></table><p class="small muted">決算書2ページ目「月別売上（収入）金額及び仕入金額」の欄に対応します。</p></div>`;
}

function trialView(r) {
  const t = r.trial;
  return `<div class="tbl-wrap"><table>

function ruleRow(r) {
  return `<tr data-id="${esc(r.id)}">
    <td><input class="rp" value="${esc(r.pattern)}" placeholder="${r.id ? '' : '新しいルール（例：ADOBE）'}"></td>
    <td><select class="rd" style="min-width:90px">${[['out', '支出'], ['in', '入金'], ['any', 'どちらも']].map(([v, l]) => `<option value="${v}" ${r.direction === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
    <td><select class="ra">${accOptions(r.account, null, '科目を選択')}</select></td>
    <td><input type="number" class="rr" min="1" max="100" value="${r.ratio}" style="width:72px"> %</td>
    <td><input type="checkbox" class="re" ${r.enabled ? 'checked' : ''}></td>
    <td style="white-space:nowrap"><button class="btn sm rs">${r.id ? '保存' : '追加'}</button>${r.id ? ' <button class="btn sm ghost rx">削除</button>' : ''}</td></tr>`;
}

function bindRules() {
  $$('#ruleRows tr').forEach(tr => {
    $('.rs', tr).onclick = async () => {
      const rule = { id: tr.dataset.id, pattern: $('.rp', tr).value.trim(), direction: $('.rd', tr).value, account: $('.ra', tr).value, ratio: Number($('.rr', tr).value) || 100, enabled: $('.re', tr).checked };
      const rules = await run('saveRule', { rule });
      $('#ruleRows').innerHTML = rules.map(ruleRow).join('') + ruleRow({ id: '', pattern: '', direction: 'out', account: '', ratio: 100, enabled: true });
      bindRules(); toast('ルールを保存しました');
    };
    const x = $('.rx', tr);
    if (x) x.onclick = async () => {
      if (!confirmInline(x)) return;
      const rules = await run('deleteRule', { id: tr.dataset.id });
      $('#ruleRows').innerHTML = rules.map(ruleRow).join('') + ruleRow({ id: '', pattern: '', direction: 'out', account: '', ratio: 100, enabled: true });
      bindRules(); toast('削除しました');
    };
  });
}

/* ================= 起動 ================= */
function applyFont(f) {
  document.documentElement.classList.remove('fs-l', 'fs-xl');
  if (f === 'l' || f === 'xl') document.documentElement.classList.add('fs-' + f);
  const l = $('#fsLbl'); if (l) l.textContent = { m: '標準', l: '大', xl: '特大' }[f] || '大';
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const n = e.target.closest('#nav a, #subnav a, .tools a[data-view]');
  if (n) { e.preventDefault(); go(n.dataset.view); }
});

(async function init() {
  const slow = setTimeout(() => {
    if (S.boot) return;
    $('#main').innerHTML = `<div class="card"><h2>起動に時間がかかっています</h2><p>はじめて開いたときや、コードを更新した直後は、シートの準備で30秒ほどかかることがあります。このままお待ちください。</p>
      <p class="small muted">1分以上この表示のままの場合：Apps Script の画面左の「実行数」を開き、赤い「失敗」の行がないかご確認ください。エラーの文面を教えていただければ原因をお調べします。</p></div>`;
  }, 15000);
  try {
    S.boot = await call('bootstrap');
    clearTimeout(slow);
  } catch (e) {
    clearTimeout(slow);
    $('#main').innerHTML = `<div class="note warn">起動できませんでした：${esc(e.message || e)}</div>`; return;
  }
  S.year = S.boot.settings.year;
  const ys = $('#year'), cy = new Date().getFullYear();
  const years = []; for (let y = cy + 1; y >= cy - 5; y--) years.push(y);
  if (!years.includes(S.year)) years.push(S.year);
  ys.innerHTML = years.map(y => `<option ${y === S.year ? 'selected' : ''}>${y}</option>`).join('');
  ys.onchange = async () => { S.year = Number(ys.value); call('saveSettings', { year: S.year }).catch(() => { }); go(S.view); };
  LEDGER_UI.mount();
  $('.tools a[data-view=settings]').innerHTML = icon('gear');
  renderNav();
  applyFont(S.boot.settings.fontScale);
  $('#fsBtn').onclick = () => {
    const next = { m: 'l', l: 'xl', xl: 'm' }[S.boot.settings.fontScale] || 'l';
    S.boot.settings.fontScale = next; applyFont(next);
    call('saveSettings', { fontScale: next }).catch(() => { });
    toast('文字の大きさ：' + { m: '標準', l: '大', xl: '特大' }[next]);
  };
  setBadge(S.boot.pending);
  go(S.boot.pending ? 'inbox' : 'home');
})();
</script>
